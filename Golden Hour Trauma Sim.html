<script>
'use strict';
/* ============================================================
   COACH — rule-based "what next?" in MARCH order
   Used in Guided mode and by the telemedicine consult.
   ============================================================ */
function coachSuggest(G) {
  const P = G.P, lf = lossFrac(P), has = id => !!did(G, id);
  const sug = (text, why, action, urgent) => ({ text, why, action: action || null, urgent: !!urgent });
  const vis = visibleWounds(G);
  const bleeding = vis.filter(w => w.rateNow > 15);
  const sc = G.sc;

  if (P.arrest) return sug('Cardiac arrest: fix the cause, not just the rhythm.', 'Traumatic arrest is almost always reversible: stop bleeding, decompress both sides of the chest, open the airway and ventilate, give blood, release tamponade. Compressions only buy time.', 'cpr', true);

  // M — massive hemorrhage
  for (const w of vis) {
    if (w.tq && !w.tq.tight && w.rateNow > 15) return sug(`Tourniquet on ${w.label} is loose.`, 'A loose tourniquet blocks veins but not arteries and can make bleeding worse. Tighten it or add a second one side by side.', 'tq_second', true);
  }
  for (const w of bleeding) {
    if (w.limb && !w.tq) return sug(`Heavy bleeding: ${w.label}.`, 'Life-threatening limb bleeding gets a tourniquet first: high and tight, then check for a missing pulse and record the time.', 'tq_cat', true);
    if (w.junctional && !w.jtq && !w.packed) return sug(`Junctional bleeding: ${w.label}.`, 'Tourniquets do not fit the groin or armpit. Pack the wound with hemostatic gauze and hold pressure for 3 minutes, or use a junctional tourniquet.', 'pack_hem', true);
    if (!w.packed && !w.pressDsg && !w.tq && w.vessel !== 'thoracic' && w.vessel !== 'internal') return sug(`Bleeding: ${w.label}.`, 'Direct pressure and a pressure bandage control smaller or non-limb bleeding.', 'pressure_dsg', true);
  }
  if (!has('ex_sweep') && !G.solo === false) { /* solo falls through */ }
  const hiddenExternal = P.wounds.some(w => w.hidden && !w.revealed && !w.internal && w.rateNow > 5);
  if (hiddenExternal && !has('ex_sweep')) return sug('Bleeding you cannot see yet.', 'Blood is still being lost and nothing visible explains it. Do a blood sweep from head to toe, including behind the casualty.', 'ex_sweep', true);
  if (hiddenExternal && has('ex_sweep') && !has('ex_logroll')) return sug('Check the back.', 'Wounds on the back are found only by rolling the casualty. Roll as one unit.', 'ex_logroll');
  if (P.wounds.some(w => w.tq && w.tq.pre) && !has('ex_recheck') && G.t < 400) return sug('Recheck the tourniquets the first responders placed.', 'You inherit someone else’s work. A tourniquet that looks fine can be loose.', 'ex_recheck');
  if (P.pelvicFx && !P.binder && (lf > 0.08 || P.sbp < 110)) return sug('Suspected pelvic fracture with shock: bind the pelvis.', 'A pelvic binder at the greater trochanters closes the pelvic volume and slows the bleeding. Do it before moving the patient.', 'pelvic_binder', true);

  // A — airway
  const st = airwayStatus(G);
  if (st !== 'patent' && !['ett', 'cric'].includes(P.airway.device)) {
    if (P.airway.swelling > 0.3) return sug('Burned/swollen airway: secure it early.', 'Swelling progresses and fluids make it worse. Intubate early with a surgical airway ready, before it closes.', G.solo ? 'air_cric' : 'air_rsi', true);
    if (P.airway.blood > 0.35) return sug(st === 'obstructed' ? 'Airway obstructed by blood: surgical airway now.' : 'Blood is filling the airway.', 'Sit him forward and suction to buy time. In massive facial trauma only a surgical airway is reliable.', st === 'obstructed' || P.airway.blood > 0.6 ? 'air_cric' : (P.airway.pos === 'sitting' ? 'air_suction' : 'air_sit'), true);
    if (P.gcs <= 8 || P.paralyzed) return sug('Unresponsive: tongue is blocking the airway.', 'Open the airway with a nasopharyngeal airway or supraglottic device.', 'air_npa', true);
  }
  if (P.paralyzed && !P.vent.mode && P.airway.device) return sug('He is paralyzed and not being ventilated.', 'After intubation start bagging or the ventilator immediately.', G.solo ? 'bvm_start' : 'vent_start', true);
  if (P.gcs <= 8 && !P.airway.device && P.icp > 0.4) return sug('GCS 8 or below: secure the airway.', 'He cannot protect his own airway. Intubate with a head-injury-safe technique and avoid hypotension.', 'air_rsi', true);

  // R — respiration
  const w0 = vis.find(w => w.thoracic && !w.sealed && P.chest[w.thoracic].open);
  if (w0) return sug('Open chest wound: seal it.', 'A vented chest seal stops air being sucked in without trapping it.', 'chest_seal', true);
  const tens = ['L', 'R'].find(s => P.chest[s].tension > 0.5);
  if (tens) { if (!has('ex_lungs') || G.t - (G.hist.filter(h => h.id === 'ex_lungs').pop() || { t: 0 }).t > 90) return sug('Worsening breathing and pressure: examine the chest.', 'Absent breath sounds on one side with falling SpO₂ and shock means tension pneumothorax.', 'ex_lungs', true); return sug(`Tension pneumothorax, ${sideName(tens)} side.`, 'Decompress with a 14g needle in the 5th space at the anterior axillary line (or the 2nd space mid-clavicular line), then place a chest tube when you can.', 'needle_d', true); }
  if (!P.mon.spo2) return sug('Put on a pulse oximeter.', 'SpO₂ and heart rate are the quickest window into breathing and circulation.', 'mon_spo2');
  if (P.spo2Disp < 94 || (lf > 0.15 && P.fio2 < 0.3) || P.cohb > 0.05) { if (P.fio2 < 0.5 && !P.airway.device) return sug('Give high-flow oxygen.', 'Oxygen for SpO₂ below 94, shock, head injury or smoke exposure (carbon monoxide).', 'o2_nrb'); }
  if (!P.mon.bp) return sug('Cycle a blood-pressure cuff.', 'A number to track the trend, but never trust it over a radial pulse and mental status.', 'mon_bp');

  // C — circulation
  const shock = P.sbp < 95 || lf > 0.18;
  if (shock && nLines(P) === 0) return sug('Get access: IO if veins are gone.', 'Shock collapses veins. After two failed IV attempts go to IO. Anything that goes in a vein goes in a bone.', 'io_access', true);
  if (lf > 0.1 && P.txaT == null && nLines(P) > 0 && elapsedInjury(G) < 10800) return sug('Give TXA 2 g.', 'Give within 3 hours of injury for anyone bleeding. It reduces death from hemorrhage.', 'txa', true);
  if (shock && nLines(P) > 0) {
    const prod = ['wb', 'prbc', 'plasma', 'dplasma'].find(k => (G.supplies[k] || 0) > 0 && k !== 'prbc') || ((G.supplies.prbc || 0) > 0 ? 'prbc' : null);
    if (prod && P.sbp < 100) { if (!G.P.warmer && (G.supplies.warmer || 0) > 0 && !G.solo) return sug('Put a warmer on the blood line.', 'Cold blood chills the patient and worsens clotting.', 'warmer_on'); if (G.flags.units >= 1 && !did(G, 'cacl') && !did(G, 'cagluc')) return sug('Give calcium with the blood.', 'Blood products bind calcium. Low calcium weakens the heart and clotting.', 'cacl', true); return sug(`Resuscitate with ${prod === 'wb' ? 'whole blood' : 'blood products'}.`, 'Replace what was lost: whole blood first, or 1:1:1 components. Aim for a radial pulse and SBP 80–90, not a normal number.', prod, true); }
    if (!prod && P.sbp < 90 && lf > 0.25 && (G.supplies.hextend || G.supplies.lr)) return sug('No blood left: small crystalloid boluses.', 'Hextend or 250 mL boluses of LR until the radial pulse returns. Avoid large volumes.', G.supplies.hextend ? 'hextend' : 'lr');
  }
  if (!G.solo && lf > 0.15 && !did(G, 'call_wbb') && (G.supplies.wb || 0) <= 2) return sug('Blood supply is running low.', 'Start the walking blood bank early: collection takes about ten minutes.', 'call_wbb');
  if (P.ica < 1.0 && (G.flags.units || 0) >= 2 && P.hr > 0) return sug('Repeat calcium.', 'Ionized calcium falls with each unit. Repeat 1 g after about four units, guided by labs.', 'cacl');

  // H — hypothermia / head
  if (P.temp < 36 && !warmed(G)) return sug('Prevent hypothermia.', 'Cold worsens bleeding. Wrap with a hypothermia kit, remove wet clothes, insulate from the ground.', 'hpmk');
  if (P.icp > 0.5) {
    if (!has('ex_pupils')) return sug('Check pupils and neurological status.', 'Document a baseline now. A blown pupil is a herniation sign.', 'ex_pupils', true);
    if (P.pupils.L === 'blown' || P.pupils.R === 'blown') { if (!has('hts') && nLines(P)) return sug('Herniation signs: hypertonic saline.', '3% saline 250 mL pulls water out of the brain and buys time.', 'hts', true); if (!G.flags.proc_burr && !G.solo) return sug('Pupil blown and not responding: burr hole.', 'When a deteriorating epidural is suspected and no neurosurgeon is reachable, evacuate it.', 'proc_burr', true); }
    if (!P.hob) return sug('Elevate the head 30°.', 'Helps venous drainage and lowers pressure.', 'head_elev');
  }
  if (P.tamp > 0.25) { if (!has('ex_efast')) return sug('Narrow pulse pressure with distended neck veins?', 'Do an eFAST to look for blood around the heart.', 'ex_efast', true); if (!G.flags.pericard && P.tamp > 0.4) return sug('Pericardial blood on ultrasound: bridge with pericardiocentesis, then open the chest.', 'Needle drainage may fail on clotted blood. The definitive treatment is thoracotomy.', 'pericardiocentesis', true); if (!G.flags.proc_ert) return sug('Open the chest.', 'Thoracotomy releases the tamponade and controls the cardiac wound.', 'proc_ert', true); }

  // scenario-specific
  if (P.tbsa > 0) {
    if (!has('ex_tbsa')) return sug('Estimate the burn size.', 'Rule of nines. It sets the fluid rate.', 'ex_tbsa');
    if (!G.flags.burnRateSet && nLines(P)) return sug(`Start burn fluids: about ${P.tbsa * 10} mL/h.`, 'Rule of 10: TBSA% × 10 mL/h for adults, then adjust to urine output.', 'burn_rate');
    if (!P.uopOn && G.flags.burnRateSet) return sug('Place a urinary catheter.', 'Urine output of 30–50 mL/h is how you know the fluid rate is right.', 'mon_foley');
    if (P.cohb > 0.08 && P.fio2 < 0.7) return sug('Smoke exposure: 100% oxygen.', 'Carbon monoxide hides from the pulse oximeter. A tight mask clears it faster.', 'o2_nrb', true);
  }
  if (P.crush && !P.crush.released) {
    if (!P.mon.ecg) return sug('Prepare for the release: monitor the heart.', 'Potassium surges when pressure is released. You need the ECG running first.', 'mon_ecg', true);
    if (nLines(P) === 0) return sug('Prepare for the release: get access.', 'You need a line before the weight lifts.', 'iv_access', true);
    if (P.fluids.cryst < 750) return sug('Pre-load with isotonic fluid.', '1–1.5 L/h of crystalloid before release dilutes the toxins and protects the kidneys. This is the exception to "avoid crystalloid".', 'lr');
  }
  if (P.crush && P.crush.released && P.k > 6.2 && !(P.kProtectUntil > G.t)) return sug('Potassium is climbing: calcium now.', 'Calcium protects the heart from hyperkalemic arrhythmias. Then bicarbonate, albuterol and insulin to shift it.', 'cacl', true);
  if (P.crush && P.crush.released && P.k > 6.2 && !did(G, 'bicarb') && (G.supplies.bicarb || 0) > 0) return sug('Shift potassium into the cells.', 'Sodium bicarbonate, albuterol and insulin/dextrose move potassium inside cells.', 'bicarb');
  if (P.venom) {
    if (!did(G, 'remove_rings')) return sug('Snakebite first aid.', 'Remove rings and watches, immobilize the limb at heart level. Never tourniquet, cut, suck or ice.', 'remove_rings');
    if (!P.venom.treated && (G.flags.marks || 0) < 2) return sug('Mark the swelling edge with the time.', 'Progression is the trigger for antivenom.', 'mark_swelling');
    if (!P.venom.treated && nLines(P)) return sug('Progressive swelling: give antivenom.', 'Pit viper antivenom stops progression and coagulopathy.', 'antivenom', true);
  }

  // diagnostics + definitive care
  if (!G.solo && !did(G, 'ex_efast') && lf > 0.1) return sug('Find the bleeding: eFAST.', 'Free fluid in the abdomen or around the heart changes the plan.', 'ex_efast');
  if (!G.solo && !did(G, 'ex_istat') && lf > 0.1) return sug('Send labs.', 'pH, lactate, K⁺, calcium and hemoglobin tell you how deep the shock is.', 'ex_istat');
  if (sc.id === 'belly' && !G.orReady) return sug('Set up the operating room.', 'Torso hemorrhage ends in the OR. Prepare it while you resuscitate.', 'or_setup');
  if (sc.id === 'belly' && G.orReady && !G.flags.proc_dcl) return sug('Go to the operating room.', 'Damage-control laparotomy: stop the bleeding, contain contamination, close temporarily.', 'proc_dcl', true);
  if (P.pain >= 5 && !analg(G)) return sug('Treat the pain.', 'Ketamine is the best choice when blood pressure is a concern. It does not lower it.', 'ketamine');
  if (!P.abx && !P.venom && !P.crush && (P.wounds.some(w => w.kind === 'gsw' || w.kind === 'blast'))) return sug('Give an antibiotic.', 'Open wounds: ertapenem 1 g IV/IM, or moxifloxacin 400 mg if he can swallow.', nLines(P) ? 'ertapenem' : 'moxifloxacin');
  if (!has('document')) return sug('Update the casualty card.', 'Times, drugs and doses travel with the patient.', 'document');
  return sug('Casualty is stable. Reassess, then hand off.', 'Recheck the MARCH priorities every few minutes and before moving the patient. Then package and request evacuation.', 'handoff');
}

          { t: 'p', x: 'An adult has about **70 mL of blood per kilogram**: roughly 5.6 litres in an 80 kg person. Blood carries oxygen from the lungs to every tissue and carries clotting factors that plug leaks. **Shock** means the tissues are not getting enough blood flow. In trauma the usual cause is blood loss, called **hemorrhagic shock**.' },
          { t: 'h', x: 'How the body fights back' },

          { t: 'h', x: 'Tension pneumothorax' },
          { t: 'p', x: 'Suspect it with chest trauma plus **increasing respiratory distress, falling SpO₂, shock, and absent breath sounds on one side**. Late signs: distended neck veins and a trachea pushed away.' },

          { q: 'What two things must be avoided in a head-injured patient?', o: ['Oxygen and fluids', 'Low oxygen and low blood pressure', 'Pain medicine and warmth', 'Head elevation and monitors'], a: 1, w: 'Hypoxia and hypotension are the secondary insults.' }

          { t: 'ol', x: ['**Abbreviated operation** (aim for 60–90 minutes or less): control hemorrhage (packing, clamping, ligation, shunts), control contamination (stapling off bowel, leaving it in discontinuity), do not reconstruct.', '**ICU resuscitation**: warm, correct acidosis and coagulopathy, ventilate.', '**Definitive surgery** at 24–72 hours: remove packs, reconstruct, close.'] },
          { t: 'h', x: 'The abbreviated laparotomy' },
          { t: 'ul', x: ['**Long midline incision**, evacuate blood and clot.', '**Pack all four quadrants** with laparotomy pads and pause for anesthesia to catch up.', '**Systematic exploration**: unpack the least likely quadrant first, address bleeders, then each in turn.', 'Typical decisions: **spleen** → splenectomy. **Liver** → pack, consider Pringle maneuver. **Mesenteric bleeder** → clamp and ligate. **Small bowel** holes → quick repair or staple off. **Colon** → resect, leave in discontinuity, no anastomosis. **Major vessel** → shunt. **Kidney** → pack or nephrectomy. **Pancreas** → wide drainage.', '**Temporary abdominal closure**: vacuum dressing or Bogotá bag. Not fascial closure: the swollen gut will cause abdominal compartment syndrome.', 'Count and **record the number of pads left in the abdomen**.'] },
          { t: 'call', k: 'key', x: 'Bail-out criteria: pH < 7.2, temperature < 34–35 °C, ongoing transfusion, or coagulopathy → stop and close. The goal is to be on the table for the shortest time that controls bleeding and contamination.' },
          { t: 'call', k: 'cpg', x: 'Austere Resuscitative Surgical Care; Emergency General Surgery in Deployed Locations; Blunt Abdominal Trauma, Splenectomy and Post-Splenectomy Vaccination.' },
          { t: 'try', surg: 'dcl', x: 'Play the Damage-Control Laparotomy' }
        ],
        quiz: [
          { q: 'In damage control surgery, injured bowel is typically…', o: ['Reconnected with an anastomosis', 'Stapled off and left in discontinuity', 'Left alone', 'Removed completely'], a: 1, w: 'Controls contamination quickly.' },
          { q: 'The abdomen is usually closed…', o: ['With fascial sutures', 'Temporarily with a vacuum dressing or Bogotá bag', 'Never', 'With staples to skin only'], a: 1, w: 'Avoids abdominal compartment syndrome.' },
          { q: 'Which is a bail-out signal?', o: ['pH below 7.2 with ongoing bleeding and cold', 'Warm patient', 'Normal INR', 'Bleeding controlled'], a: 0, w: 'The lethal triad.' }
        ]

      {
        id: 'l-reboa', title: 'REBOA and aortic control', min: 8, body: [
          { t: 'p', x: '**REBOA** (resuscitative endovascular balloon occlusion of the aorta) places a balloon catheter in the aorta through the femoral artery and inflates it to stop blood flow below. It raises the pressure above the balloon and gives the surgeon time.' },
          { t: 'table', head: ['Zone', 'Aorta segment', 'Use'], rows: [['Zone 1', 'Left subclavian to celiac artery (balloon at about the xiphoid)', 'Intra-abdominal and torso hemorrhage'], ['Zone 2', 'Celiac to lowest renal', 'Do not occlude here'], ['Zone 3', 'Lowest renal to aortic bifurcation (balloon at about the umbilicus)', 'Pelvic, junctional and proximal-leg hemorrhage']] },
          { t: 'ul', x: ['Access the **common femoral artery** with ultrasound, 7 Fr sheath (ER-REBOA type).', 'Insert to the **external landmark** for the chosen zone.', 'Inflate slowly with saline while watching the arterial pressure. Stop when the pressure responds.', 'Record the **inflation time**. Occlusion is a bridge only: ischemia accumulates below the balloon, so plan the definitive step before you inflate.'] },
          { t: 'call', k: 'cpg', x: 'REBOA for Hemorrhagic Shock CPG (JTS).' },
          { t: 'try', surg: 'reboa', x: 'Play the REBOA mini-game' }
        ],
        quiz: [
          { q: 'Which zone for a pelvic hemorrhage?', o: ['Zone 1', 'Zone 2', 'Zone 3', 'Any'], a: 2, w: 'Zone 3, below the renal arteries.' },
          { q: 'What is the major cost of REBOA?', o: ['Cost', 'Ischemia below the balloon over time', 'Allergy', 'Infection'], a: 1, w: 'Time-limited occlusion.' }
        ]
      },
      {
        id: 'l-ert', title: 'Resuscitative thoracotomy and tamponade', min: 10, body: [
          { t: 'p', x: '**Emergent resuscitative thoracotomy (ERT)** opens the chest in a patient who is about to die or has just arrested from penetrating chest trauma. Goals: release **cardiac tamponade**, control bleeding from the heart or lung, clamp the aorta, and do internal cardiac massage.' },
          { t: 'h', x: 'Cardiac tamponade' },
          { t: 'ul', x: ['Blood fills the sac around the heart, which cannot fill.', '**Beck\'s triad**: low blood pressure, distended neck veins, muffled heart sounds. Often a narrow pulse pressure.', 'eFAST shows fluid around the heart. Pericardiocentesis helps temporarily, but clotted blood often blocks the needle.'] },
          { t: 'h', x: 'The operation (outline)' },
          { t: 'ol', x: ['Left anterolateral incision in the 4th–5th intercostal space from the sternum toward the bed, extend across the sternum as a "clamshell" if needed.', 'Spread the ribs.', 'Open the pericardium **longitudinally, anterior to the phrenic nerve**.', 'Evacuate the clot, plug the cardiac wound (finger, Foley, staples, sutures).', 'Internal cardiac massage (two hands), aim ~ 80/min.', 'Cross-clamp the **descending aorta** to maintain brain and heart perfusion. Note the time.', 'Transfer to the OR.'] },
          { t: 'call', k: 'cpg', x: 'Emergent Resuscitative Thoracotomy (ERT) CPG; AO Procedure Notes form.' },
          { t: 'try', s: 'tamponade', x: 'Try the Parasternal Wound scenario' },
          { t: 'try', surg: 'ert', x: 'Play the thoracotomy mini-game' }
        ],
        quiz: [
          { q: 'The pericardium is opened…', o: ['Anterior to the phrenic nerve', 'Posterior to the phrenic nerve', 'Transversely', 'Not at all'], a: 0, w: 'Longitudinally, anterior to the phrenic nerve.' },
          { q: 'Beck\'s triad includes…', o: ['Fever, rash, cough', 'Low BP, distended neck veins, muffled heart sounds', 'Chest pain, nausea, sweating', 'Cough, hemoptysis, wheeze'], a: 1, w: 'Classic tamponade findings.' }
        ]
      },
      {
        id: 'l-pelvis', title: 'Pelvic fracture care', min: 7, body: [
          { t: 'p', x: 'Unstable pelvic fractures bleed from the bone and the veins around it, often 1–3 litres. Management is an escalation ladder.' },
          { t: 'ol', x: ['**Binder** early at the greater trochanters.', '**Resuscitate** with blood and TXA; avoid more movement.', '**eFAST** and chest X-ray to exclude other sources.', 'If still unstable: **REBOA Zone 3**, **preperitoneal pelvic packing**, or an external fixator at the surgical level.', 'Avoid catheter if there is blood at the meatus; image the urethra first.', 'Do **not** repeatedly rock or log-roll.'] },
          { t: 'call', k: 'cpg', x: 'Pelvic Fracture Care CPG; Genitourinary Injury Trauma Management CPG.' },
          { t: 'try', s: 'pelvis', x: 'Try the Rollover Pelvis scenario' }
        ],
        quiz: [{ q: 'First step for suspected unstable pelvic fracture with shock?', o: ['Foley', 'Pelvic binder', 'Repeated pelvic rocking', 'Walk him'], a: 1, w: 'Bind early.' }]
      },
      {
        id: 'l-ext', title: 'Extremity: vascular injury, shunts, fasciotomy, amputation', min: 10, body: [
          { t: 'h', x: 'Vascular injury' },
          { t: 'p', x: 'Limb arteries must have blood flow restored within about **6 hours** of injury to save the limb. Hard signs of vascular injury: pulsatile bleeding, expanding hematoma, absent distal pulses, thrill or bruit, signs of ischemia (the five "P"s: pain, pallor, pulselessness, paralysis, paresthesia).' },
          { t: 'p', x: 'The fast solution in a damage control setting is a **temporary intravascular shunt** (Argyle, Pruitt-Inahara): control the vessel above and below, flush with heparinized saline, pass the shunt into both ends, and tie it in. Flow returns in minutes and definitive repair can wait.' },
          { t: 'h', x: 'Compartment syndrome and fasciotomy' },
          { t: 'p', x: 'After ischemia, crush, or fracture, muscle swelling inside tight fascia compartments squeezes the blood supply. The lower leg has **four compartments**. Release them via **two incisions** (lateral and medial) of full length. Do not wait for pulses to disappear: pulses can persist in compartment syndrome.' },
          { t: 'h', x: 'Amputation' },
          { t: 'p', x: 'Save life, then length. Wounds are debrided, left open, and stumps are kept as long as viable. A guillotine-style amputation preserves tissue for later closure.' },
          { t: 'call', k: 'cpg', x: 'Vascular Injury CPG; Acute Extremity Compartment Syndrome and Fasciotomy; Amputation: Evaluation and Treatment; Orthopaedic Trauma: Extremity Fractures; War Wounds: Debridement and Irrigation.' },
          { t: 'try', surg: 'shunt', x: 'Play the shunt + fasciotomy mini-game' }
        ],
        quiz: [
          { q: 'How many compartments in the lower leg?', o: ['Two', 'Three', 'Four', 'Six'], a: 2, w: 'Anterior, lateral, superficial posterior, deep posterior.' },
          { q: 'The fast method to restore limb blood flow in a damaged artery is…', o: ['Definitive bypass in the field', 'Temporary intravascular shunt', 'Heat', 'Compression bandage'], a: 1, w: 'A shunt buys time.' }
        ]
      },
      {
        id: 'l-dcbi', title: 'Blast and dismounted complex blast injury', min: 8, body: [
          { t: 'p', x: 'Explosions injure in four ways.' },
          { t: 'ul', x: ['**Primary**: pressure wave. Affects air-filled organs: ears, lungs (blast lung), bowel.', '**Secondary**: fragments and debris. Penetrating wounds.', '**Tertiary**: being thrown. Fractures, head injury.', '**Quaternary**: burns, crush, toxic exposure.'] },
          { t: 'p', x: '**Dismounted complex blast injury (DCBI)** from a buried IED: bilateral lower-limb amputations, pelvic and groin injury, genital injury, and often arm injury. They bleed from several places at once and cool quickly.' },
          { t: 'ul', x: ['Tourniquets high and tight on every amputated limb, then re-check at the surgical site.', 'Look for the hidden **junctional** and pelvic bleed.', 'Pelvic binder, TXA, blood, calcium, warmth.', 'Eventually: debridement, amputation revision, repeat washouts.', 'Check ears and eyes: **aural blast injury** and **eye trauma** are easy to miss.'] },
          { t: 'call', k: 'cpg', x: '(High Bilateral) Amputations and Dismounted Complex Blast Injury CPG; Aural Blast Injury/Acoustic Trauma and Hearing Loss CPG.' },
          { t: 'try', s: 'blast', x: 'Try the Convoy IED scenario' }
        ],
        quiz: [{ q: 'Blast lung is which type of blast injury?', o: ['Primary', 'Secondary', 'Tertiary', 'Quaternary'], a: 0, w: 'Pressure wave on air-filled organs.' }]
      },
      {
        id: 'l-tbi', title: 'Traumatic brain injury', min: 9, body: [
          { t: 'p', x: 'Treat the brain by protecting what it needs: oxygen, blood flow and a quiet pressure.' },
          { t: 'table', head: ['GCS', 'Severity', 'Action'], rows: [['13–15', 'Mild', 'Observe, repeat neuro checks'], ['9–12', 'Moderate', 'Close watch, prepare airway'], ['≤ 8', 'Severe', 'Secure the airway, avoid hypoxia/hypotension']] },
          { t: 'h', x: 'Epidural hematoma' },
          { t: 'p', x: 'A tear in an artery under a skull fracture (classically the temple) bleeds between skull and dura. The patient may be fine for minutes to hours (**lucid interval**) before sudden deterioration. A fixed, dilated pupil on the same side is the herniation sign.' },
          { t: 'h', x: 'Treat' },
          { t: 'ul', x: ['SpO₂ ≥ 90 (aim ≥ 94 %), SBP ≥ 100–110, EtCO₂ 35–45.', 'Head up 30°.', 'Herniation signs: 3 % saline 250 mL (or 5 %), brief hyperventilation to EtCO₂ 30–35 as a bridge only.', 'Avoid hypotonic fluids; avoid sedatives before documenting the neuro exam.', 'Emergency **burr hole / craniectomy** when a clot is suspected, the patient is declining, and no neurosurgeon is reachable.'] },
          { t: 'call', k: 'cpg', x: 'TBI and Neurosurgery in the Deployed Environment; TBI Management in Prolonged Field Care; Catastrophic Non-Survivable Brain Injury.' },
          { t: 'try', s: 'head', x: 'Try the Blast Head scenario' }
        ],
        quiz: [
          { q: 'A lucid interval is classically seen with…', o: ['Epidural hematoma', 'Concussion', 'Spinal injury', 'Hypothermia'], a: 0, w: 'Arterial bleed that expands after a delay.' },
          { q: 'Which EtCO₂ range is the usual TBI target?', o: ['15–20', '35–45', '55–65', '70–80'], a: 1, w: 'Normal CO₂ avoids both low and high intracranial pressure effects.' }
        ]
      },
      {
        id: 'l-cranial', title: 'Emergency cranial procedures by non-neurosurgeons', min: 7, body: [
          { t: 'p', x: 'The JTS CPG on emergency life-saving cranial procedures was written for exactly this situation: a general surgeon or other provider, hours from a neurosurgeon, with a patient who is herniating.' },
          { t: 'ul', x: ['Indication: GCS falling, unilateral dilated pupil, and a likely mass (e.g., epidural hematoma).', 'Burr hole on the side of the dilated pupil, usually in the temporal region over the skull fracture.', 'Perforator with an automatic clutch avoids plunging through the inner table. Sense the "give" at the dura.', 'Evacuate clot with suction and irrigation. Control the source. Close.', 'After the procedure: same ICP care, transfer to a neurosurgical center.'] },
          { t: 'call', k: 'warn', x: 'This mini-game is a simplification for teaching. The CPG describes the full technique, indications and limits.' },
          { t: 'call', k: 'cpg', x: 'Emergency Life-Saving Cranial Procedures by Non-Neurosurgeons in the Deployed Setting CPG.' },
          { t: 'try', surg: 'burr', x: 'Play the burr-hole mini-game' }
        ],
        quiz: [{ q: 'Where is an emergency burr hole usually placed?', o: ['Opposite the dilated pupil', 'Same side as the dilated pupil', 'On the back of the head', 'On the forehead'], a: 1, w: 'Ipsilateral to the blown pupil.' }]
      }
    ]
  },
  {
    id: 'L4', title: 'Special injuries', blurb: 'Burns, crush, envenomation and other situations where the usual rules change.', who: 'clinician',
    lessons: [
      {
        id: 'l-burn', title: 'Burns and inhalation injury', min: 11, body: [
          { t: 'h', x: 'Size and depth' },
          { t: 'ul', x: ['**Rule of nines** (adult): head 9 %, each arm 9 %, front torso 18 %, back 18 %, each leg 18 %, groin 1 %. A patient\'s palm ≈ 1 %.', 'Count only partial- and full-thickness burns.'] },
          { t: 'h', x: 'Fluids: the Rule of 10' },
          { t: 'p', x: 'For adults 40–80 kg: **starting rate (mL/h) = TBSA % × 10** with LR or Plasma-Lyte. Add 100 mL/h for each 10 kg above 80 kg. Then adjust every hour: urine output **< 30 mL/h** → increase by 20 %; **> 50 mL/h** → decrease by 20 %. Avoid "fluid creep" which causes pulmonary edema and compartment syndromes.' },
          { t: 'h', x: 'Inhalation injury' },
          { t: 'ul', x: ['Clues: fire in an enclosed space, soot around the nose or mouth, singed nasal hair, hoarseness, stridor, wheeze, burned face.', '**Airway swelling progresses** over hours and with resuscitation. **Intubate early**, before it closes. Have a surgical airway ready.', '**Carbon monoxide**: pulse oximeter is falsely normal. Give 100 % oxygen by tight non-rebreather or ventilator.', '**Cyanide**: suspect with enclosed fire, altered mental status, hypotension, lactate > 8. Hydroxocobalamin 5 g IV.'] },
          { t: 'h', x: 'Other burn care' },
          { t: 'ul', x: ['Stop the burning, remove clothes and jewelry. Cover with **dry, clean dressings**. Not wet dressings on > 20 % TBSA.', 'Prevent hypothermia: burn patients cool fast.', 'Pain: ketamine, fentanyl. Burns are very painful.', '**Escharotomy** if circumferential full-thickness burns constrict the chest or a limb.'] },
          { t: 'call', k: 'cpg', x: 'Burn Care CPG; Burn Wound Management in Prolonged Field Care; Inhalation Injury and Toxic Industrial Chemical Exposure; JTS Burn Resuscitation Worksheet and Flow Chart (forms).' },
          { t: 'try', s: 'burn', x: 'Try the Truck Fire scenario' }
        ],
        quiz: [
          { q: 'A 50 % TBSA burn, 75 kg adult. Rule-of-10 starting rate?', o: ['100 mL/h', '250 mL/h', '500 mL/h', '1,000 mL/h'], a: 2, w: '50 × 10 = 500 mL/h.' },
          { q: 'Urine output is 20 mL/h. You should…', o: ['Decrease fluids 20 %', 'Increase fluids about 20 %', 'Stop fluids', 'Give a diuretic'], a: 1, w: 'Below target, increase.' },
          { q: 'Why intubate early in inhalation injury?', o: ['Airway swelling progresses and can close', 'Fire hurts lungs more', 'To give oxygen', 'Because of pain'], a: 0, w: 'Swelling worsens with time and fluid.' }
        ]
      },
      {
        id: 'l-crush', title: 'Crush syndrome and hyperkalemia', min: 9, body: [
          { t: 'p', x: 'Muscles pinned for more than about **1 hour** begin to die. When the weight is lifted, the damaged muscle releases **potassium, myoglobin and acid** into the blood. Potassium can rise fast enough to stop the heart within minutes of release, even in someone who looked well.' },
          { t: 'h', x: 'Before release' },
          { t: 'ul', x: ['IV/IO access and **isotonic fluid 1–1.5 L/h** (crystalloid is the right choice here).', 'ECG monitoring.', 'Have calcium, bicarbonate, albuterol ready.', 'Consider a tourniquet for a limb that will be amputated or if bleeding is expected.'] },
          { t: 'h', x: 'After release' },
          { t: 'ul', x: ['ECG: **peaked T waves → wide QRS → sine wave → VF**. Treat early.', '**Calcium** 1 g CaCl or 3 g gluconate IV: protects the heart (does not lower potassium).', '**Shifting agents**: sodium bicarbonate 50 mEq, albuterol 10–20 mg nebulized, insulin 10 U with dextrose.', 'Maintain high urine output (200–300 mL/h in prolonged cases) and consider dialysis later.', 'Watch for **compartment syndrome** and perform **fasciotomy** when needed.'] },
          { t: 'call', k: 'cpg', x: 'Crush Syndrome — Prolonged Field Care CPG; Hyperkalemia and Dialysis in the Deployed Setting CPG; Acute Extremity Compartment Syndrome.' },
          { t: 'try', s: 'crush', x: 'Try the Collapsed Building scenario' }
        ],
        quiz: [
          { q: 'The most feared event after releasing a long-entrapped person is…', o: ['Fever', 'Hyperkalemic cardiac arrest', 'Infection', 'Hypothermia'], a: 1, w: 'Potassium surge.' },
          { q: 'Calcium in hyperkalemia…', o: ['Lowers potassium', 'Protects the heart membrane', 'Dilutes blood', 'Treats pain'], a: 1, w: 'It stabilizes the cardiac membrane.' }
        ]
      },
      {
        id: 'l-special', title: 'Envenomation, eye, CBRN and other special situations', min: 10, body: [
          { t: 'h', x: 'Snakebite (pit vipers)' },
          { t: 'ul', x: ['**Do**: remove rings and watches, immobilize at heart level, mark the swelling edge with the time every 15–30 minutes, get IV access, treat pain, evacuate, give **antivenom** for progressive swelling or coagulopathy.', '**Don\'t**: tourniquet, ice, cut, suck, electric shock, NSAIDs (bleeding risk).'] },
          { t: 'h', x: 'Eye trauma' },
          { t: 'ul', x: ['Open globe: **rigid shield**, no pressure, no ointment, keep head elevated, give moxifloxacin, avoid vomiting, evacuate.', 'Chemical splash: irrigate immediately for 15–30 minutes.'] },
          { t: 'h', x: 'Aural blast' },
          { t: 'p', x: 'Ruptured eardrums and hearing loss are common after blasts. Look in the ears and ask about hearing and ringing. Keep ears dry and arrange follow up.' },
          { t: 'h', x: 'CBRN (chemical, biological, radiological, nuclear) first response' },
          { t: 'ul', x: ['Protect yourself first. Decontaminate before treating where possible.', 'Nerve agents: SLUDGE symptoms (salivation, lacrimation, urination, defecation, GI upset, emesis), pinpoint pupils, seizures → **atropine** and **pralidoxime** (autoinjectors).', 'Cyanide: hydroxocobalamin.', 'Radiation: time, distance, shielding; manage conventional trauma first.'] },
          { t: 'h', x: 'Heat illness and cold injury' },
          { t: 'ul', x: ['**Heat stroke** (core ≥ 40 °C with altered mental status): cool first, transport second. Ice-water immersion is the best treatment.', '**Frostbite**: rewarm in 37–39 °C water only when refreezing cannot happen. Hold on to the tissue.'] },
          { t: 'call', k: 'cpg', x: 'Snakebite Envenomation; Spider and Scorpion Envenomation; Eye Trauma: Initial Care; Aural Blast Injury; CBRN Injury Parts 1–4; Frostbite and Immersion Foot Care; Exertional Heat Illness (hosted); Drowning Management.' },
          { t: 'try', s: 'snake', x: 'Try the Rattlesnake scenario' }
        ],
        quiz: [
          { q: 'Which is correct snakebite first aid?', o: ['Tourniquet', 'Ice', 'Immobilize at heart level and mark swelling', 'Cut and suck'], a: 2, w: 'Immobilize and mark. The rest do harm.' },
          { q: 'Rigid shield on an eye with a visible foreign body: apply…', o: ['Firm pressure', 'A shield without pressure', 'A tight patch', 'Nothing'], a: 1, w: 'Do not press on an open globe.' }
        ]
      }
    ]

  {
    id: 'L5', title: 'Team and systems', blurb: 'The people, communication and logistics that turn individual skill into survival.', who: 'clinician',
    lessons: [
      {
        id: 'l-team', title: 'How a surgical team works', min: 9, body: [
          { t: 'p', x: 'A Special Operations Surgical Team is a small, mobile group that sets up near the fight. Compositions vary by service and mission, but typically include a **trauma/general surgeon**, an **emergency physician**, a **nurse anesthetist (CRNA)**, a **critical-care or OR nurse**, and a **surgical technician**. They carry blood, an operating table, anesthesia equipment, monitors and a small supply of surgical sets.' },
          { t: 'table', head: ['Role', 'Typical responsibilities'], rows: [['Surgeon', 'Operative decisions, thoracotomy, laparotomy, vascular control; team leader for surgery'], ['Emergency physician', 'Resuscitation lead in the bay, ultrasound, procedures (chest tube, cric), triage'], ['CRNA', 'Airway, anesthesia, ventilator, arterial line, drugs and blood in the OR'], ['Nurse', 'Access, blood administration, monitoring, documentation, patient flow'], ['Surgical tech', 'Instruments, setup, counts, assisting']] },
          { t: 'h', x: 'Principles' },
          { t: 'ul', x: ['**Parallel work**: while one person secures the airway, another starts access, another controls bleeding.', '**Closed-loop communication**: "Starting two units whole blood." "Two units whole blood going in." It prevents errors.', '**One leader** who steps back and watches the whole patient.', '**Call out changes** in vital signs.', '**Resource awareness**: blood, oxygen and hands are finite.'] },
          { t: 'call', k: 'tip', x: 'In the Field Sim, each team member appears as a card. Watch who is free and who is tied up. A person ventilating with a bag-valve mask is not available until a ventilator takes over.' }
        ],
        quiz: [{ q: 'Closed-loop communication means…', o: ['Using code words', 'Repeating orders back to confirm', 'Talking quietly', 'Writing everything'], a: 1, w: 'Orders are acknowledged and confirmed.' }]
      },
      {
        id: 'l-handoff', title: 'Handoff and documentation', min: 8, body: [
          { t: 'p', x: 'The best care is wasted if the next team does not know what was done. Two structures dominate.' },
          { t: 'table', head: ['Tool', 'What it is', 'Contents'], rows: [['MIST / ATMIST', 'Verbal handoff', 'Age, Time of injury, Mechanism, Injuries, Signs, Treatment'], ['9-line MEDEVAC', 'Radio request', 'Location, frequency, patients by precedence, equipment, number by type, security, marking, nationality, CBRN'], ['DD 1380 (TCCC card)', 'Paper casualty card', 'Tourniquet times, fluids, meds with times and doses, vitals'], ['DD 3019 / MASCAL record', 'Resuscitation record', 'Timed record of vitals, fluids, blood, procedures'], ['DA 4700', 'En route care record', 'Evacuation documentation']] },
          { t: 'ul', x: ['Write the **time** on every tourniquet and drug.', 'Record every **blood product** and ratio.', 'State the **most urgent unmet problem** (for example "still bleeding from the pelvis, binder on, REBOA not done").'] },
          { t: 'call', k: 'cpg', x: 'Documentation Requirements for Combat Casualty Care; Documentation in Prolonged Field Care; En Route Care Patient Packaging; MASCAL/Austere Team Resuscitation Record (forms).' }
        ],
        quiz: [{ q: 'What does the "T" in the first position of ATMIST stand for?', o: ['Treatment', 'Time of injury', 'Triage', 'Temperature'], a: 1, w: 'Age, Time of injury, Mechanism, Injuries, Signs, Treatment.' }]
      },
      {
        id: 'l-pfc', title: 'Prolonged casualty care', min: 8, body: [
          { t: 'p', x: 'When weather, distance or the enemy delay evacuation, the casualty stays with you for hours or days. Care shifts from resuscitation to critical-care nursing.' },
          { t: 'ul', x: ['**Monitor** vital signs, urine output, temperature, pain and sedation on a regular schedule.', '**Ventilator** care and prevention of ventilator-associated pneumonia (head up, oral care, sedation holds).', '**Fluids, blood and electrolytes** on a flow sheet.', '**Pain and sedation** ladders.', '**Wound care**, negative-pressure dressings, splint checks.', '**Skin**: turn the patient, protect heels and sacrum.', '**Sepsis** recognition and antibiotics.', '**Nutrition** after the first days.', '**Telemedicine** to reach specialists.'] },
          { t: 'call', k: 'cpg', x: 'Prolonged Casualty Care Guidelines; Nursing Interventions, Wound Care and Splint Management in Prolonged Casualty Care; Sepsis Management in PFC; Analgesia and Sedation in PFC; Nutritional Support; Prevention of VTE; Ventilator-Associated Pneumonia.' }
        ],
        quiz: [{ q: 'Which is a prolonged-care priority?', o: ['Only drugs', 'Regular reassessment and nursing care', 'Waiting', 'Moving the patient often'], a: 1, w: 'Monitoring and nursing keep patients alive over hours.' }]
      },
      {
        id: 'l-mascal', title: 'Mass casualty (MASCAL) and triage', min: 7, body: [
          { t: 'p', x: 'When casualties outnumber resources, the goal changes from doing the most for each person to doing the most good for the most people.' },
          { t: 'table', head: ['Category', 'Meaning', 'Example'], rows: [['Immediate (red)', 'Life-threatening, treatable with limited resources', 'Tension pneumothorax, controllable hemorrhage, airway'], ['Delayed (yellow)', 'Serious but can wait', 'Stable fractures, stable burns'], ['Minimal (green)', 'Walking wounded', 'Minor lacerations'], ['Expectant (black)', 'Unlikely to survive given resources', 'Massive brain injury, extensive burns with no capacity']] },
          { t: 'ul', x: ['Reassess: categories change.', 'Treat the killers in each patient quickly (tourniquet, airway, decompress).', 'Use the MASCAL/Austere team resuscitation record to track many patients.', 'Plan blood and oxygen use for the whole group.'] },
          { t: 'call', k: 'cpg', x: 'MASCAL/Austere Team Resuscitation Record (JTS form); Joint En Route Care Guidelines.' }
        ],
        quiz: [{ q: 'A walking casualty with a small laceration is…', o: ['Immediate', 'Delayed', 'Minimal', 'Expectant'], a: 2, w: 'Minimal (green).' }]
      }

  id: 'l-medmath', title: 'Medication math and safe dosing', min: 10, body: [
    { t: 'p', x: 'In the Field Sim you type every dose yourself. Real medicine works the same way: the right drug at the wrong dose can fail to help or can harm. This lesson gives you the arithmetic and the habits.' },

  npa: { title: 'Nasopharyngeal airway', base: 'Quick airway aid for a patient with a gag reflex or low GCS.', steps: () => [
      { id: 'seq', title: 'Place the airway', q: 'Size it, lubricate it, and pass it straight back along the floor of the nose.', t: 'scene', scene: 'npa', pts: 60, w: 'Nostril to earlobe, lubricate, straight back along the nasal floor.' },
    { id: 'when', title: 'Avoid when', q: 'Which situation makes you cautious?', t: 'choice', o: ['Obvious skull-base fracture with blood or clear fluid from the nose; use gently or choose another route', 'Unconscious casualty with snoring', 'Low GCS from blast', 'Facial burns without bleeding'], a: 0, w: 'It can pass through a fractured skull base. If other options fail, the airway still comes first.', pts: 40 }
  ] },
  io: { title: 'Intraosseous access', base: 'When you cannot get a vein: go through the bone.', steps: () => [
      { id: 'seq', title: 'Place the IO', q: 'Find the humeral site, drive the needle until the pop, then flush.', t: 'scene', scene: 'io', pts: 70, w: 'Greater tubercle, drive to the pop, flush with saline.' },
    { id: 'pain', title: 'Pain', q: 'The patient is awake. What do you add?', t: 'choice', o: ['Lidocaine 2% slowly before the flush', 'Nothing', 'Ice', 'Wait for the pain to pass'], a: 0, w: 'The flush hurts. Lidocaine makes it bearable.', pts: 20 }
  ] },
  chesttube: { title: 'Tube thoracostomy', base: 'Definitive treatment for hemothorax or pneumothorax.', steps: () => [
      { id: 'seq', title: 'Place the tube', q: 'Find the safe triangle, cut, sweep, aim the tube to the apex, connect.', t: 'scene', scene: 'tube', arg: () => (Math.random() < 0.5 ? 'L' : 'R'), pts: 70, w: 'Safe triangle, finger sweep, aim for the apex, connect to drainage.' },
    { id: 'check', title: 'After', q: 'What do you watch for?', t: 'choice', o: ['Over 1500 mL initial blood or over 200 mL/h means surgery may be needed', 'Nothing', 'Only the color of the tube', 'Remove it in an hour'], a: 0, w: 'Large output signals ongoing hemorrhage. Prepare for thoracotomy.', pts: 20 }
  ] }
};
SURG.SKILL_LIST = [['cric', 'Cricothyroidotomy'], ['needle', 'Needle decompression'], ['tq', 'Tourniquet'], ['pack', 'Wound packing'], ['npa', 'Nasopharyngeal airway'], ['io', 'IO access'], ['chesttube', 'Chest tube']];
SURG.PROC_LIST = [['dcl', 'Damage-control laparotomy', 'The flagship case: pack, find, fix, resuscitate, and close the abdomen.'], ['ert', 'Resuscitative thoracotomy', 'Open the chest to release tamponade and clamp the aorta.'], ['reboa', 'REBOA', 'Balloon the aorta from the groin to stop hemorrhage below.'], ['burr', 'Emergency burr hole', 'Drill a temporal burr hole to relieve an epidural clot.'], ['shunt', 'Vascular shunt and fasciotomy', 'Restore flow in a cut artery and open the compartments.']];

/* ---------- results screen ---------- */
SURG.results = function (body, title, res, rows, teach, onDone, practice) {
  SURG.clock('');
  const g = res.score >= 85 ? 'Expert' : res.score >= 65 ? 'Proficient' : res.score >= 45 ? 'Developing' : 'Needs practice';
  body.innerHTML = `<div class="stepwrap"><div class="grade ${res.score < 45 ? 'bad' : ''}"><b>${res.score}</b><span>${g}</span></div><h3>${esc(title)}</h3>${rows ? `<table class="tbl"><tbody>${rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>` : ''}${teach ? `<ul class="teach">${teach.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}<div class="row"><button class="btn primary" id="rs-done">${practice ? 'Back to the Operating Room' : 'Return to the case'}</button></div></div>`;
  $('#rs-done').onclick = onDone;
};

/* ---------- launch ---------- */
SURG.launch = function (procId, snap, opts, cb) {
  opts = opts || {}; let fin = false;
  const out = (res) => { if (fin) return; fin = true; SURG.close(); cb && cb(res); };
  if (procId === 'dcl') return SURG.dcl(snap, opts, out);
  const def = SURG.DEFS[procId] || SURG.SKILLS[procId]; if (!def) { return cb && cb({ aborted: true }); }
  const body = SURG.open(def.title, () => out({ aborted: true }));
  body.innerHTML = `<div class="stepwrap"><h3>${esc(def.title)}</h3><p class="lede">${esc(def.base)}</p>${def.cpg ? `<p class="muted">Based on: ${esc(def.cpg)}</p>` : ''}<p>${opts.mode === 'guided' || opts.practice ? 'Hints are on.' : 'No hints in this mode.'} Wrong answers cost time and points but you still finish, so you can learn the reason.</p><div class="row"><button class="btn primary" id="or-begin">Begin</button></div></div>`;
  $('#or-begin').onclick = () => {
    SURG.runSteps(body, def, snap, opts, r => {
      const extra = def.result ? def.result(r, snap) : {};
      const res = Object.assign({ score: r.score, seconds: r.seconds }, extra, { patient: null });
      const rows = [['Score', r.score + ' / 100'], ['Time in the procedure', fmtDur(r.seconds)], ['Mistakes', String(r.wrong)]].concat(r.notes.length ? [['Review', r.notes.join('; ')]] : []);
      SURG.results(body, def.title, res, rows, null, () => out(res), opts.practice);
    });
  };
};
</script>
<script>
'use strict';
/* ============================================================
   DAMAGE-CONTROL LAPAROTOMY — the flagship minigame
   Stages: checklist → incision → clot + packing → explore and fix → close
   Time passes only when you act. Every action costs seconds, and the
   patient bleeds for those seconds. The lethal triad drifts the wrong way.
   ============================================================ */
const DCL_INJ = {
  spleen: { name: 'Splenic laceration', q: 'LUQ', bleed: 260, fix: ['splenectomy'], time: 300, note: 'Shattered spleen, bleeding from the hilum. In damage control, splenectomy is fast.' },
  liver: { name: 'Liver laceration', q: 'RUQ', bleed: 180, fix: ['pack'], time: 60, note: 'Deep laceration of the right lobe. Perihepatic packing compresses it.' },
  mesentery: { name: 'Mesenteric bleeder', q: 'RLQ', bleed: 130, fix: ['clamp', 'ligate'], time: 120, note: 'Spurting branch in the small-bowel mesentery.' },
  iliac: { name: 'Iliac artery injury', q: 'LLQ', bleed: 330, fix: ['clamp', 'shunt'], time: 240, note: 'Left common iliac artery is half transected. A temporary shunt restores leg flow.' },
  bowel: { name: 'Small-bowel perforations', q: 'RLQ', bleed: 10, fix: ['staple'], time: 150, leak: true, note: 'Two holes in the ileum spilling contents. Staple off and leave in discontinuity.' },
  pancreas: { name: 'Pancreatic / duodenal injury', q: 'RUQ', bleed: 30, fix: ['drain'], time: 90, note: 'Peripancreatic hematoma with a leak. Wide drainage; no reconstruction now.' }
};
const DCL_TOOLS = { clamp: 'Clamp', ligate: 'Ligate', staple: 'Staple', shunt: 'Shunt', pack: 'Pack', splenectomy: 'Splenectomy', drain: 'Drain' };
const DCL_WRONG = { clamp: 'A clamp alone does not finish the job.', ligate: 'Tying it off here would not work or must wait for control.', staple: 'Staples seal bowel, not arteries or solid organs.', shunt: 'A shunt is only for a cut artery.', pack: 'Packing alone will not fix this injury.', splenectomy: 'Splenectomy is for the spleen only.', drain: 'A drain does not stop bleeding.' };
const DCL_Q = { RUQ: [40, 60, 110, 110], LUQ: [150, 60, 110, 110], RLQ: [40, 170, 110, 110], LLQ: [150, 170, 110, 110] };

SURG.dcl = function (snap, opts, out) {
  const p = Object.assign({}, snap, { sec: 0, used: { wb: 0, prbc: 0, plasma: 0, cacl: 0 }, txaNow: false, startTemp: snap.temp, minTemp: snap.temp, maxAcid: snap.acid, maxCoag: snap.coag });
  p.warmer = !!snap.warmer; p.bv0 = p.bv;
  const guided = opts.mode === 'guided' || opts.practice;
  const body = SURG.open('Damage-control laparotomy', () => finishNow(true));
  const sc = { checklist: 0, incision: 0, packed: 0, clot: 0, wrong: 0, log: [], inj: [], found: {}, quadPack: {}, pads: 0, stage: 'pre', closure: null, padGuess: null, died: false, bail: false };
  // choose injuries
  const pickSet = opts.injuries || (() => { const major = ['spleen', 'iliac', 'mesentery']; const m = major[Math.floor(Math.random() * 3)]; const rest = ['liver', 'bowel', 'pancreas', 'mesentery', 'spleen'].filter(x => x !== m); const out = [m]; while (out.length < 3 + (Math.random() < 0.5 ? 1 : 0) && rest.length) out.push(rest.splice(Math.floor(Math.random() * rest.length), 1)[0]); return out; })();
  sc.inj = pickSet.map(id => Object.assign({ id, fixedStep: 0, fixed: false, found: false }, DCL_INJ[id]));
  const BS = guided ? 0.7 : 1; const ooze = () => (30 + p.coag * 160) * BS;
  const cur = () => {
    let b = ooze();
    sc.inj.forEach(i => { if (i.fixed) return; const packed = sc.quadPack[i.q]; b += i.bleed * BS * (packed ? (i.id === 'liver' ? 0.1 : 0.25) : 1); });
    return b;
  };
  const add = (cls, txt) => { sc.log.push({ cls, txt, t: p.sec }); };
  function adv(s) {
    const b = cur(), m = s / 60; p.bleed = b;
    const loss = b * m; p.rbc -= loss * (p.rbc / Math.max(1, p.bv)); p.bv = Math.max(0, p.bv - loss);
    p.temp = Math.max(30, p.temp - 0.03 * m * (p.warmer ? 0.25 : 1.25));
    const lf = 1 - p.bv / p.bvNorm;
    p.acid = Math.min(0.5, p.acid + (lf > 0.3 ? 0.012 : lf > 0.2 ? 0.006 : 0.002) * m);
    p.coag = Math.min(1, p.coag + ((p.temp < 35 ? 0.025 : 0.008) + (p.acid > 0.15 ? 0.02 : 0) + p.dil * 0.01) * m * (p.txa || p.txaNow ? 0.6 : 1));
    p.ica = Math.max(0.6, p.ica - 0.012 * m);
    p.sec += s; p.minTemp = Math.min(p.minTemp, p.temp); p.maxAcid = Math.max(p.maxAcid, p.acid); p.maxCoag = Math.max(p.maxCoag, p.coag);
    if (p.bv / p.bvNorm < 0.3 && !sc.died) { sc.died = true; add('crit', 'Pressure lost. The heart stops from blood loss.'); }
  }
  const triad = () => { let n = 0; if (p.temp < 34) n++; if (p.acid > 0.2) n++; if (p.coag > 0.5) n++; return n; };

  /* ---------- layout ---------- */
  function shell() {
    body.innerHTML = `<div class="or-grid"><div class="or-main" id="or-main"></div><aside class="or-side" id="or-side"></aside></div>`;
    side();
  }
  function bar(label, val, lo, hi, bad, fmt) { const pct = clamp((val - lo) / (hi - lo), 0, 1) * 100; return `<div class="gauge ${bad ? 'bad' : ''}"><span>${label}</span><div class="gb"><i style="width:${pct}%"></i></div><b>${fmt}${bad ? ' ⚠' : ''}</b></div>`; }
  function side() {
    const el = $('#or-side'); if (!el) return;
    const vol = Math.round(100 * p.bv / p.bvNorm), t = triad();
    SURG.clock(`OR time ${fmtT(p.sec)} · volume ${vol}%`);
    const wbN = p.wb - p.used.wb, prbcN = Math.min(p.prbc - p.used.prbc, p.plasma - p.used.plasma), caN = p.cacl - p.used.cacl;
    const dis = sc.stage === 'pre' || sc.stage === 'incise' || sc.stage === 'done';
    el.innerHTML = `<h4>Lethal triad</h4><div class="triad-m ${t >= 2 ? 'danger' : ''}">${bar('Blood volume', vol, 30, 100, vol < 55, vol + '%')}${bar('Temperature', p.temp, 31, 37, p.temp < 34, p.temp.toFixed(1) + '°C')}${bar('Acid (pH)', 7.45 - p.acid, 6.9, 7.45, p.acid > 0.2, (7.4 - p.acid).toFixed(2))}${bar('Clotting', 1 - p.coag, 0, 1, p.coag > 0.5, p.coag > 0.5 ? 'impaired' : p.coag > 0.3 ? 'reduced' : 'ok')}${bar('Calcium', p.ica, 0.6, 1.3, p.ica < 0.9, p.ica.toFixed(2))}</div>
    <p class="bleedn">Bleeding now: <b>${Math.round(cur())} mL/min</b></p>${t >= 2 && sc.stage !== 'done' ? '<p class="alert">Two or more triad limits crossed. Damage control says: stop, pack, close, resuscitate.</p>' : ''}
    <h4>Anesthesia</h4><div class="anes">
      <button class="btn sm" data-an="wb" ${dis || wbN < 1 ? 'disabled' : ''}>Whole blood (${wbN})</button>
      <button class="btn sm" data-an="comp" ${dis || prbcN < 1 ? 'disabled' : ''}>1 RBC + 1 plasma (${Math.max(0, prbcN)})</button>
      <button class="btn sm" data-an="cacl" ${dis || caN < 1 ? 'disabled' : ''}>Calcium 1 g (${caN})</button>
      <button class="btn sm" data-an="txa" ${dis || p.txa || p.txaNow ? 'disabled' : ''}>${p.txa || p.txaNow ? 'TXA given' : 'TXA 2 g'}</button>
      <button class="btn sm" data-an="warm" ${dis ? 'disabled' : ''} aria-pressed="${p.warmer}">${p.warmer ? 'Warming on' : 'Start warming'}</button></div>
    <h4>Log</h4><ul class="orlog">${sc.log.slice(-7).reverse().map(l => `<li class="${l.cls}"><time>${fmtT(l.t)}</time> ${esc(l.txt)}</li>`).join('')}</ul>`;
    el.querySelectorAll('[data-an]').forEach(b => b.onclick = () => anes(b.dataset.an));
  }
  function anes(k) {
    if (sc.stage === 'pre' || sc.stage === 'incise' || sc.stage === 'done') return;
    if (k === 'wb') { p.used.wb++; p.bv += 500; p.rbc += 500 * 0.4; p.coag = Math.max(0, p.coag - 0.07); p.temp += 0.1; p.acid = Math.max(0, p.acid - 0.015); p.ica -= 0.04; add('ok', 'Whole blood in.'); adv(20); }
    if (k === 'comp') { p.used.prbc++; p.used.plasma++; p.bv += 600; p.rbc += 300; p.coag = Math.max(0, p.coag - 0.05); p.dil += 0.02; p.ica -= 0.05; add('ok', 'Red cells and plasma in.'); adv(25); }
    if (k === 'cacl') { p.used.cacl++; p.ica = Math.min(1.3, p.ica + 0.18); p.coag = Math.max(0, p.coag - 0.02); add('ok', 'Calcium given.'); adv(15); }
    if (k === 'txa') { p.txaNow = true; add('ok', 'TXA given. Clots resist breakdown.'); adv(20); }
    if (k === 'warm') { p.warmer = !p.warmer; add('', p.warmer ? 'Forced-air warmer and fluid warmer on.' : 'Warmer off.'); }
    refresh();
  }
  function refresh() { if (sc.died) return died(); side(); stageDraw(); }
  function died() { sc.stage = 'done'; side(); const m = $('#or-main'); if (m) m.innerHTML = `<div class="stepwrap"><h3>The patient has died on the table</h3><p>Blood loss outran resuscitation. Review: pack early, get blood running before you explore, give calcium, and bail out when the triad is crossed.</p><div class="row"><button class="btn primary" id="dd">Continue</button></div></div>`; $('#dd').onclick = () => finishNow(false); }

  /* ---------- stage dispatcher ---------- */
  function stageDraw() { const m = $('#or-main'); if (!m || sc.stage === 'done') return; ({ pre: sPre, incise: sIncise, clot: sClot, explore: sExplore, close: sClose })[sc.stage](m); }
  function go(st) { sc.stage = st; if (!$('#or-main')) shell(); refresh(); }

  /* ---------- pre-op checklist ---------- */
  function sPre(m) {
    const items = [['Warm the room and start forced-air warming', 1], ['Blood, plasma and calcium in the room', 1], ['Give TXA and a first dose of antibiotics', 1], ['Prep wide: chin to knees, arms out', 1], ['Baseline instrument and sponge count', 1], ['Wait for a CT scan', 0], ['Complete a long written consent form', 0], ['Hold blood until labs are back', 0], ['Scrub for ten minutes before anything else', 0]];
    const order = shuffleSeed(items.map((x, i) => [x, i]), 11);
    m.innerHTML = `<div class="stepwrap"><p class="eyebrow">Step 1 of 5</p><h3>Before the incision</h3><p class="q">The patient is on the table, BP ${Math.round(p.sbp)}, and the abdomen is distended. Pick everything the team should do in the next minute. Pick only what saves time or blood.</p><div class="opts multi" id="chk">${order.map(([x, i]) => `<button class="opt" role="checkbox" aria-checked="false" data-i="${i}">${esc(x[0])}</button>`).join('')}</div>${guided ? '<p class="hint">Hint: everything that keeps the patient warm, ready for blood, and ready to cut is right. Anything that delays is wrong.</p>' : ''}<div class="row"><button class="btn primary" id="chk-go">Go to the incision</button></div></div>`;
    m.querySelectorAll('.opt').forEach(b => b.onclick = () => { const on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', on); b.classList.toggle('sel', on); });
    $('#chk-go').onclick = () => {
      let good = 0, bad = 0, missed = 0; m.querySelectorAll('.opt').forEach(b => { const on = b.getAttribute('aria-checked') === 'true', ok = items[+b.dataset.i][1]; if (on && ok) good++; else if (on && !ok) bad++; else if (!on && ok) missed++; });
      sc.checklist = Math.max(0, Math.round(10 * (good - bad) / 5));
      p.sec += 20 + bad * 120 + missed * 10; sc.wrong += bad;
      if (m.querySelector('[data-i="0"]').getAttribute('aria-checked') === 'true') p.warmer = true;
      if (m.querySelector('[data-i="2"]').getAttribute('aria-checked') === 'true') { p.txaNow = true; }
      if (bad) add('warn', `${bad} delay${bad > 1 ? 's' : ''} cost ${bad * 2} minutes.`);
      if (missed) add('warn', 'Something important was missed in the prep.');
      adv(bad * 120 + 20); go('incise');
    };
  }

  /* ---------- incision: trace the midline ---------- */
  function sIncise(m) {
    m.innerHTML = `<div class="stepwrap"><p class="eyebrow">Step 2 of 5</p><h3>Midline incision</h3><p class="q">Draw from the xiphoid process down to the pubis in one stroke. Stay on the dotted line. Press and drag.</p><div class="svgbox"><svg id="inc" class="dg" viewBox="0 0 300 340" style="touch-action:none" role="img" aria-label="Abdomen. Draw a line from top to bottom along the dotted midline."><path d="M60,10 Q150,0 240,10 L262,90 Q270,230 240,330 L60,330 Q30,230 38,90 Z" fill="var(--body)" stroke="var(--line)" stroke-width="2"/><circle cx="150" cy="170" r="5" fill="var(--muted)"/><text x="158" y="174" class="dg-t dim" font-size="10">navel</text><line x1="150" y1="22" x2="150" y2="320" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/><circle cx="150" cy="22" r="9" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/><text x="166" y="26" class="dg-t" font-size="11">Xiphoid</text><circle cx="150" cy="320" r="9" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/><text x="166" y="324" class="dg-t" font-size="11">Pubis</text><polyline id="inc-l" points="" fill="none" stroke="var(--crit)" stroke-width="3" stroke-linecap="round"/></svg></div><p class="muted" id="inc-s">Start at the top circle.</p></div>`;
    const svg = $('#inc'), line = $('#inc-l'); let pts = [], down = false, t0 = 0, started = false;
    const pos = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 300, (e.clientY - r.top) / r.height * 340]; };
    svg.onpointerdown = e => { const [x, y] = pos(e); if (Math.hypot(x - 150, y - 22) > 30) { $('#inc-s').textContent = 'Start inside the top circle.'; return; } down = true; started = true; pts = [[x, y]]; t0 = performance.now(); svg.setPointerCapture(e.pointerId); };
    svg.onpointermove = e => { if (!down) return; const [x, y] = pos(e); pts.push([x, y]); line.setAttribute('points', pts.map(q => q.join(',')).join(' ')); };
    svg.onpointerup = () => {
      if (!down) return; down = false; const last = pts[pts.length - 1];
      if (last[1] < 295 || pts.length < 6) { $('#inc-s').textContent = 'Not far enough. Try again and drag all the way to the pubis.'; line.setAttribute('points', ''); return; }
      const dev = pts.reduce((a, q) => a + Math.abs(q[0] - 150), 0) / pts.length, secs = (performance.now() - t0) / 1000;
      sc.incision = Math.round(clamp(10 - dev / 3.2 - Math.max(0, secs - 4) * 0.5, 0, 10));
      const cost = 45 + Math.round(clamp(dev, 0, 40) * 2 + secs * 3);
      add('', `Midline laparotomy open in ${cost} s. Blood and clot pour out.`); adv(cost); go('clot');
    };
  }

  /* ---------- clot evacuation and four-quadrant packing ---------- */
  function absSVG(opts2) {
    let s = `<svg class="dg abd" viewBox="0 0 300 340" role="group" aria-label="Open abdomen divided into four quadrants"><path d="M60,10 Q150,0 240,10 L262,90 Q270,230 240,330 L60,330 Q30,230 38,90 Z" fill="var(--body)" stroke="var(--line)" stroke-width="2"/>`;
    s += `<text x="46" y="52" class="dg-t dim" font-size="10">Patient right</text><text x="254" y="52" text-anchor="end" class="dg-t dim" font-size="10">Patient left</text>`;
    Object.keys(DCL_Q).forEach(q => {
      const [x, y, w, h] = DCL_Q[q], packed = sc.quadPack[q], open = sc.found[q];
      const ij = sc.inj.filter(i => i.q === q && i.found && !i.fixed);
      s += `<g class="zone q ${packed ? 'packed' : ''} ${open ? 'open' : ''}" data-q="${q}" tabindex="0" role="button" aria-label="${q}${packed ? ' packed' : ''}"><rect x="${x}" y="${y + (q[1] === 'U' ? 0 : 0)}" width="${w}" height="${h}" rx="14" fill="${packed ? 'var(--surface)' : 'var(--crit)'}" fill-opacity="${packed ? 0.9 : (sc.clot ? 0.14 : 0.3)}" stroke="${packed ? 'var(--muted)' : 'var(--crit)'}" stroke-width="2" stroke-dasharray="${packed ? '0' : '5 4'}"/><text x="${x + w / 2}" y="${y + 20}" text-anchor="middle" class="dg-t" font-size="12" font-weight="700">${q}</text>`;
      if (packed) s += `<rect x="${x + 28}" y="${y + 36}" width="${w - 56}" height="${h - 60}" rx="6" fill="var(--bg)" stroke="var(--muted)" stroke-width="2"/><path d="M${x + w / 2},${y + 52} v${h - 92} M${x + 38},${y + h / 2 + 4} h${w - 76}" stroke="var(--crit)" stroke-width="3"/>`;
      ij.forEach((i, k) => { s += `<circle cx="${x + 30 + k * 30}" cy="${y + 56}" r="11" fill="var(--crit)" stroke="var(--surface)" stroke-width="2"/>`; });
      s += `</g>`;
    });
    return s + '</svg>';
  }
  function sClot(m) {
    const n = Object.values(sc.quadPack).filter(Boolean).length, packed4 = n === 4;
    m.innerHTML = `<div class="stepwrap"><p class="eyebrow">Step 3 of 5</p><h3>Clot out, then pack all four quadrants</h3><p class="q">Blood fills the abdomen. Scoop out the clot to see, then place a laparotomy pad in each quadrant. Packing buys time before you chase any bleeder.</p><div class="svgbox">${absSVG()}</div><div class="row"><button class="btn" id="cl-ev" ${sc.clot ? 'disabled' : ''}>${sc.clot ? 'Clot evacuated' : 'Evacuate clot (30 s)'}</button><button class="btn primary" id="cl-go" ${packed4 ? '' : 'disabled'}>Packed. Resuscitate and explore</button><button class="btn danger sm" id="cl-bail">Pack and close now</button></div><p class="muted">Pads in: ${sc.pads}. Each pad takes 10 seconds.</p>${guided ? '<p class="hint">Hint: pack all four first. Then use the anesthesia buttons at the right to catch up before opening any pack.</p>' : ''}</div>`;
    m.querySelectorAll('[data-q]').forEach(g => { const f = () => { if (!sc.clot) { toast('Evacuate the clot first so you can see.', 'warn'); return; } const q = g.dataset.q; if (sc.quadPack[q]) return; sc.quadPack[q] = true; sc.pads++; add('', `Pad placed in ${q}.`); adv(10); refresh(); }; g.onclick = f; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
    $('#cl-ev').onclick = () => { sc.clot = 1; add('', 'Clot evacuated with hands and suction. Bleeding is visible.'); adv(30); refresh(); };
    $('#cl-go').onclick = () => { sc.packed = 15; go('explore'); };
    $('#cl-bail').onclick = () => bail();
  }

  /* ---------- explore and fix ---------- */
  function sExplore(m) {
    const exploredAll = ['RUQ', 'LUQ', 'RLQ', 'LLQ'].every(q => sc.found[q]);
    const open = ['RUQ', 'LUQ', 'RLQ', 'LLQ'].filter(q => sc.found[q] && !sc.quadPack[q]);
    const cards = sc.inj.filter(i => i.found && !i.fixed);
    m.innerHTML = `<div class="stepwrap"><p class="eyebrow">Step 4 of 5</p><h3>Explore and fix</h3><p class="q">Take the packs out one quadrant at a time, starting where the worst bleeding is likely. Fix what you find with the right tool. Re-pack a quadrant any time you need a pause.</p><div class="svgbox">${absSVG()}</div>
      <div class="row">${['RUQ', 'LUQ', 'RLQ', 'LLQ'].map(q => `<button class="btn sm" data-ex="${q}" ${sc.found[q] && !sc.quadPack[q] ? 'disabled' : ''}>${sc.quadPack[q] ? 'Unpack ' + q : sc.found[q] ? q + ' open' : 'Explore ' + q}</button>`).join('')}</div>
      <div class="inj">${cards.length ? cards.map(i => `<div class="inj-c"><b>${esc(i.name)}</b> <em>${i.q}${i.fixedStep > 0 ? ' · step ' + (i.fixedStep + 1) + ' of ' + i.fix.length : ''}</em><p>${esc(i.note)}</p><div class="tools">${Object.keys(DCL_TOOLS).map(t => `<button class="btn sm tool" data-inj="${i.id}" data-tool="${t}">${DCL_TOOLS[t]}</button>`).join('')}</div></div>`).join('') : `<p class="muted">${exploredAll ? 'No open problems. You have found everything.' : 'No bleeders in the open quadrants yet.'}</p>`}</div>
      <div class="row"><button class="btn" id="ex-rp" ${open.length ? '' : 'disabled'}>Re-pack open quadrants</button><button class="btn primary" id="ex-done">Finish and close</button><button class="btn danger sm" id="ex-bail">Bail out: pack and close</button></div>${guided ? '<p class="hint">Hint: spleen needs a splenectomy; mesentery needs clamp then ligate; iliac artery needs clamp then shunt; bowel holes need staples; liver needs a pack; pancreatic leak needs a drain.</p>' : ''}</div>`;
    m.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
      const q = b.dataset.ex; sc.quadPack[q] = false; sc.found[q] = true; sc.inj.filter(i => i.q === q).forEach(i => i.found = true); adv(20);
      const here = sc.inj.filter(i => i.q === q && !i.fixed);
      add(here.length ? 'warn' : 'ok', here.length ? `${q}: found ${here.map(i => i.name.toLowerCase()).join(' and ')}.` : `${q}: clear. Nothing to fix.`); refresh();
    });
    m.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
      const i = sc.inj.find(x => x.id === b.dataset.inj), t = b.dataset.tool;
      if (t === i.fix[i.fixedStep]) { i.fixedStep++; const c = Math.round(i.time / i.fix.length); adv(c); if (i.fixedStep >= i.fix.length) { i.fixed = true; add('ok', `${i.name}: controlled.`); } else add('', `${DCL_TOOLS[t]} done on ${i.name.toLowerCase()}. Next step.`); }
      else { sc.wrong++; adv(30); add('bad', `${DCL_TOOLS[t]} on ${i.name.toLowerCase()}: ${DCL_WRONG[t]} (30 s lost)`); }
      refresh();
    });
    $('#ex-rp').onclick = () => { open.forEach(q => { sc.quadPack[q] = true; sc.pads++; adv(10); }); add('', 'Open quadrants re-packed.'); refresh(); };
    $('#ex-done').onclick = () => { const left = sc.inj.filter(i => !i.fixed && !(i.id === 'liver' && sc.quadPack[i.q])); if (left.length && !SURG._warned) { SURG._warned = 1; toast(`${left.length} injury${left.length > 1 ? 'ies' : ''} not yet controlled. Press again to close anyway.`, 'warn'); return; } SURG._warned = 0; go('close'); };
    $('#ex-bail').onclick = () => bail();
  }
  function bail() { sc.bail = true; ['RUQ', 'LUQ', 'RLQ', 'LLQ'].forEach(q => { if (!sc.quadPack[q]) { sc.quadPack[q] = true; sc.pads++; adv(10); } }); add('warn', 'Bail-out: all quadrants packed.'); go('close'); }

  /* ---------- closure + pad count ---------- */
  function sClose(m) {
    const inSitu = Object.values(sc.quadPack).filter(Boolean).length + (sc.pads - Object.values(sc.quadPack).filter(Boolean).length > 0 ? 0 : 0);
    sc.padTrue = Object.values(sc.quadPack).filter(Boolean).length;
    m.innerHTML = `<div class="stepwrap"><p class="eyebrow">Step 5 of 5</p><h3>Close the abdomen for now</h3><p class="q">The goal is not a perfect repair. It is stopping bleeding and getting the patient to the ICU to warm up and resuscitate. Choose the closure.</p><div class="opts" id="cl-opts">${shuffleSeed([['vac', 'Temporary abdominal closure: negative-pressure dressing over the viscera'], ['bog', 'Temporary closure with a sterile bag sewn to the skin (Bogotá bag)'], ['prim', 'Close the fascia primarily with sutures'], ['open', 'Leave the abdomen open with a moist towel only']], 4).map(([id, t]) => `<button class="opt" data-c="${id}">${esc(t)}</button>`).join('')}</div>
    <p class="q">How many packs are still inside the abdomen? (Written on the board and in the record.)</p><div class="step-n"><button class="btn" id="pd-">−</button><b id="pd-v">${sc.padTrue}</b><button class="btn" id="pd+">+</button></div>
    <div class="row"><button class="btn primary" id="cl-fin" disabled>Finish operation</button></div><div id="cl-fb"></div></div>`;
    let ch = null, n = sc.padTrue + (Math.random() < 0.0 ? 1 : 0); const upd = () => { $('#pd-v').textContent = n; };
    m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ch = b.dataset.c; m.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('sel', x === b)); $('#cl-fin').disabled = false; });
    $('#pd-').onclick = () => { n = Math.max(0, n - 1); upd(); }; $('#pd\\+').onclick = () => { n = Math.min(8, n + 1); upd(); };
    $('#cl-fin').onclick = () => { sc.closure = ch; sc.padGuess = n; adv(ch === 'vac' ? 120 : ch === 'bog' ? 150 : ch === 'prim' ? 240 : 60); finishNow(false); };
  }

  /* ---------- scoring and finish ---------- */
  function finishNow(aborted) {
    if (aborted && sc.stage !== 'done') return out({ aborted: true });
    const injLeft = sc.inj.filter(i => !i.fixed);
    const ctrl = sc.inj.every(i => i.fixed || (sc.quadPack[i.q]) );
    const fixedN = sc.inj.filter(i => i.fixed).length;
    const bleedOK = !sc.died && ctrl && p.bleed < 200 + 1;
    const leakLeft = sc.inj.some(i => i.leak && !i.fixed);
    const parts = [];
    parts.push(['Preparation', sc.checklist, 10]);
    parts.push(['Incision', sc.incision, 10]);
    parts.push(['Clot and packing', (sc.clot ? 5 : 0) + (sc.pads ? 5 : 0) + (sc.packed ? 5 : 0), 15]);
    parts.push(['Injuries fixed', Math.round(30 * fixedN / Math.max(1, sc.inj.length)) - Math.min(10, sc.wrong * 2) + (leakLeft ? -3 : 0), 30]);
    parts.push(['Resuscitation', (p.minTemp >= 34.5 ? 6 : p.minTemp >= 33.5 ? 3 : 0) + (p.maxAcid < 0.2 ? 6 : p.maxAcid < 0.3 ? 3 : 0) + (p.maxCoag < 0.5 ? 6 : p.maxCoag < 0.7 ? 3 : 0) + ((p.txa || p.txaNow) ? 2 : 0), 20]);
    const cl = sc.closure; parts.push(['Closure and count', (cl === 'vac' ? 6 : cl === 'bog' ? 5 : cl === 'prim' ? 0 : cl === 'open' ? 2 : 0) + (sc.padGuess === sc.padTrue ? 4 : 0), 10]);
    parts.push(['Speed', p.sec < 900 ? 5 : p.sec < 1500 ? 3 : p.sec < 2400 ? 1 : 0, 5]);
    let score = parts.reduce((a, x) => a + Math.max(0, Math.min(x[2], x[1])), 0); if (sc.died) score = Math.min(score, 30);
    const res = {
      score, seconds: p.sec, bleedControlled: bleedOK, success: bleedOK, died: sc.died, cause: 'bleeding during surgery', txaGiven: !!p.txaNow,
      used: { wb: p.used.wb, prbc: p.used.prbc, plasma: p.used.plasma, cacl: p.used.cacl },
      patient: { bv: p.bv, rbc: p.rbc, temp: p.temp, acid: p.acid, coag: p.coag, ica: p.ica, dil: p.dil, prodCorr: p.prodCorr, k: p.k },
      closureOk: cl === 'vac' || cl === 'bog'

    sc.stage = 'done';
    const shown = parts.map(x => [x[0], Math.max(0, Math.min(x[2], x[1])) + ' / ' + x[2]]).concat([['Time', fmtT(p.sec)], ['Lowest temperature', p.minTemp.toFixed(1) + '°C'], ['Lowest pH', (7.4 - p.maxAcid).toFixed(2)], ['Packs left in', String(sc.padTrue) + (sc.padGuess === sc.padTrue ? ' (count correct)' : ' (you wrote ' + sc.padGuess + ')')]]);
    const teach = ['Damage control surgery is a staged plan: stop bleeding and contamination, then leave. Reconstruction waits for a warm, resuscitated patient.', 'Packing first gives anesthesia time to catch up. Blood, calcium and TXA go in while you work.', 'Crossing two lethal-triad limits (cold, acid, bad clotting) is the signal to stop and close, even with work left to do.', 'Primary fascial closure after massive resuscitation risks abdominal compartment syndrome. Use a temporary closure and plan a second look in 24–48 hours.', 'Every pack left in is documented and counted. A wrong count is a safety event.'];
    if (sc.died) teach.unshift('The patient did not survive the operation. Next time: pack all four quadrants before exploring, start blood early, and bail out when the triad turns.');
    if (!SURG.ov) return out(res);
    SURG.results($('#or-body'), 'Damage-control laparotomy', res, shown, teach, () => out(res), opts.practice);
  }

  shell(); go('pre');
};
</script>
<script>
'use strict';
/* ============================================================

const SCN = {};

SURG.runScene = function (root, def, opts, done) {
  const hints = !!(opts.practice || opts.mode === 'guided'), showPath = opts.mode !== 'realistic';
  const S = Object.assign({}, def.init || {});
  const stages = def.stages;
  const R = { frac: 0, mistakes: 0, sec: 0, log: [] }; let weights = stages.reduce((a, s) => a + (s.w || 1), 0), gained = 0, idx = 0, stage = null, tries = 0, finished = false;
  root.innerHTML = `<div class="scn"><div class="scn-h"><b id="scn-t"></b><span id="scn-n"></span></div><svg id="scn-svg" viewBox="${def.vb || '0 0 300 300'}" class="dg scn-svg" role="application" aria-label="${esc(def.label || 'Interactive procedure')}"></svg><p id="scn-q" class="q"></p><div id="scn-ctl" class="row"></div><p id="scn-m" class="scn-m" role="status" aria-live="polite"></p><ol id="scn-log" class="scn-log"></ol></div>`;

  function flash(p, ok) { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 9); c.setAttribute('class', 'tapmark ' + (ok ? 'ok' : 'bad')); ov.appendChild(c); setTimeout(() => c.remove(), 700); }

  }

  }

    svg.onpointermove = e => { if (!on) return; const p = svgPt(svg, e); if (dist(p, c) < 6) return; const a = Math.atan2(p.y - c.y, p.x - c.x); let d = a - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; acc += d; a0 = a; rd(); if (Math.abs(acc) / (2 * Math.PI) >= N) { on = false; svg.onpointermove = svg.onpointerup = svg.onpointerdown = null; S.turns = N; pass(1); } };

  };

  K.slide = st => {
    const a = st.from, b = st.to; let p = 0, on = false; const zone = st.zone;
    const rd = () => { S.slide = p; const hx = a.x + (b.x - a.x) * p, hy = a.y + (b.y - a.y) * p; draw(`<line class="track" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>${hints ? `<line class="trackzone" x1="${a.x + (b.x - a.x) * zone[0]}" y1="${a.y + (b.y - a.y) * zone[0]}" x2="${a.x + (b.x - a.x) * zone[1]}" y2="${a.y + (b.y - a.y) * zone[1]}"/>` : ''}<circle class="handle" cx="${hx}" cy="${hy}" r="13"/>`); };
    rd();
    svg.onpointerdown = e => { const q = svgPt(svg, e); const hx = a.x + (b.x - a.x) * p, hy = a.y + (b.y - a.y) * p; if (dist(q, { x: hx, y: hy }) < 30) { on = true; svg.setPointerCapture(e.pointerId); } };
    svg.onpointermove = e => { if (!on) return; const q = svgPt(svg, e); const dx = b.x - a.x, dy = b.y - a.y; p = clamp(((q.x - a.x) * dx + (q.y - a.y) * dy) / (dx * dx + dy * dy), 0, 1); rd(); };
    svg.onpointerup = () => { if (!on) return; on = false; if (p >= zone[0] && p <= zone[1]) { svg.onpointermove = svg.onpointerup = svg.onpointerdown = null; pass(1); } else { const m = p < zone[0] ? st.low : st.high; p = 0; rd(); miss(m || 'Not right. Try again.'); } };
  };
  /* ---- meter stages: timing sweep / press-and-hold / repeated taps ---- */
  function meter(st, mode) {
    draw(''); const ctl = $('#scn-ctl', root);
    const speed = (st.speed || 0.7) * (hints ? 0.75 : 1);
    if (mode === 'rep') {
      let n = 0; ctl.innerHTML = `<button class="btn primary big" id="rp">${esc(st.btn || 'Press')}</button><div class="meter"><b class="fill" id="rpf" style="width:0"></b></div>`;
      $('#rp', root).onclick = () => { n++; S.rep = n / st.n; $('#rpf', root).style.width = (100 * n / st.n) + '%'; draw(''); if (n >= st.n) { $('#rp', root).disabled = true; pass(1); } }; return;
    }
    ctl.innerHTML = `<div class="meter" id="mt"><i class="zone" style="left:${st.zone[0] * 100}%;width:${(st.zone[1] - st.zone[0]) * 100}%"></i><b class="cur" id="cur"></b></div><button class="btn primary big" id="act">${esc(st.btn || (mode === 'timing' ? 'Stop' : 'Press and hold'))}</button>`;
    const cur = $('#cur', root), act = $('#act', root); let v = 0, dir = 1, last = performance.now(), holding = false, stopped = false;
    const loop = ts => { if (stopped || finished) return; const dt = (ts - last) / 1000; last = ts; if (mode === 'timing') { v += dir * speed * dt; if (v >= 1) { v = 1; dir = -1; } if (v <= 0) { v = 0; dir = 1; } } else if (holding) { v += speed * 0.8 * dt; if (v >= 1) { v = 1; holding = false; stopped = true; cur.style.left = '100%'; return judge(); } } cur.style.left = (v * 100) + '%'; S.hold = v; SURG.raf = requestAnimationFrame(loop); };
    const judge = () => { stopped = true; cancelAnimationFrame(SURG.raf); if (v >= st.zone[0] && v <= st.zone[1]) { act.disabled = true; pass(1); } else { const m = v < st.zone[0] ? (st.low || 'Not far enough.') : (st.over || 'Too far.'); stopped = false; v = 0; dir = 1; last = performance.now(); SURG.raf = requestAnimationFrame(loop); miss(m); } };
    SURG.raf = requestAnimationFrame(loop);
    if (mode === 'timing') act.onclick = judge; else { act.onpointerdown = e => { e.preventDefault(); holding = true; }; const rel = () => { if (holding) { holding = false; judge(); } }; act.onpointerup = rel; act.onpointerleave = rel; act.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); holding = true; } }; act.onkeyup = e => { if ((e.key === ' ' || e.key === 'Enter') && holding) { holding = false; judge(); } }; }
  }
  K.timing = st => meter(st, 'timing'); K.hold = st => meter(st, 'hold'); K.rep = st => meter(st, 'rep');
  begin();
  return { stop() { finished = true; cancelAnimationFrame(SURG.raf); } };
};

<script>

/* weight in pounds per unit, as packed (includes packaging / cold chain) */
const ITEM_W = { tq: .25, hemgauze: .3, ebandage: .4, jtq: 1.2, binder: 1.1, tsplint: 3.5, splint: .5, npa: .1, sga: .2, suction: 3.5, rsi: 2, cric: .8, o2: 4.5, vent: 9, seal: .1, needle: .15, chesttube: 1.2, pericardio: 1, iv: .3, io: .8, cvc: 1.2, aline: 1, foley: .4, istat: .3, wb: 2.2, prbc: 1.8, plasma: 1.8, dplasma: .8, plt: 2, lr: .7, hextend: 1.3, hts: .7, warmer: 2.5, txa: .15, cacl: .1, cagluc: .2, ket: .1, fent: .05, otfc: .05, apap: .1, melox: .02, ondans: .02, ertap: .15, moxi: .5, naloxone: .02, bicarb: .3, albuterol: .2, insulin: .2, antivenom: .5, hydroxo: .8, epi: .05, norepi: .3, hpmk: 2.5, blanket: 1, bair: 3, dressing: .3, eyeshield: .1, collar: .7, npwt: 2.5, mida: .05, d50: .2 };
const ITEM_GROUPS = [

  ['Airway and breathing', ['npa', 'sga', 'suction', 'rsi', 'cric', 'o2', 'vent', 'seal', 'needle', 'chesttube', 'pericardio']],

];
