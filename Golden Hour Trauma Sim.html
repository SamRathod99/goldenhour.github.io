const PRESETS = {
  balanced: { label: 'Balanced', note: 'A general trauma load. Blood, hemorrhage control and a reduced airway set.', q: { tq: 6, hemgauze: 5, ebandage: 5, jtq: 1, binder: 1, splint: 2, dressing: 8, npa: 3, sga: 2, suction: 1, rsi: 2, cric: 2, o2: 3, vent: 1, seal: 4, needle: 5, chesttube: 2, pericardio: 1, iv: 8, io: 4, cvc: 1, aline: 1, foley: 2, istat: 4, wb: 8, prbc: 3, plasma: 3, dplasma: 3, lr: 8, hextend: 1, hts: 3, warmer: 2, txa: 4, cacl: 4, cagluc: 2, epi: 3, norepi: 2, bicarb: 2, insulin: 2, d50: 2, albuterol: 2, ket: 6, fent: 4, otfc: 2, mida: 3, apap: 2, ondans: 2, naloxone: 2, ertap: 3, moxi: 1, hpmk: 3, blanket: 3, eyeshield: 2, collar: 2 } },

  empty: { label: 'Empty packs', note: 'Start from nothing.', q: {} }
};
function packWeight(q) { let w = 0; for (const k in q) w += (q[k] || 0) * (ITEM_W[k] || 0); return w; }

  const a = [], g = k => q[k] || 0;

  if (g('wb') + g('prbc') + g('plasma') + g('dplasma') < 6) a.push(['bad', 'Very little blood. Hemorrhagic shock needs blood, not salt water.']);
  if (g('wb') === 0 && g('prbc') === 0) a.push(['warn', 'No red cells. Plasma alone does not carry oxygen.']);
  if (g('txa') < 2) a.push(['warn', 'TXA is light. It is given to most bleeding casualties.']);

}

const FRONT = [8, 12, 15, 21, 26, 30, 38, 44, 51, 59];             // front position (km along the axis) at the start of each day
const SHELL_RANGE = 7, WARN_RANGE = 13;
function siteMargin(site, day) { return site.ax - FRONT[Math.min(day, CAMP_DAYS) - 1]; }
function siteEvac(site, day) { return clamp(Math.round(12 + siteMargin(site, day) * 1.7), 10, 95); }   // minutes from point of injury to the CCP
function siteRisk(site, day) { const m = siteMargin(site, day); return clamp((WARN_RANGE + 6 - m) / (WARN_RANGE + 6), 0, 1) * (1 - site.cover * 0.2); }
function siteLead(site) { return site.lzMin > 60 ? 1 : 0; }         // extra supply days for remote sites
function frontPolygon(f) {
  let poly = [[0, 0], [MAP_W, 0], [MAP_W, MAP_H], [0, MAP_H]];
  const val = p => AX(p[0], p[1]) - f, out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], va = val(a), vb = val(b);
    if (va <= 0) out.push(a);
    if ((va < 0 && vb > 0) || (va > 0 && vb < 0)) { const t = va / (va - vb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  return out;
}

<script>
'use strict';
/* ============================================================
   CAMPAIGN — Operation IRON LANTERN: ten days, logistics, a moving front, one mass casualty
   ============================================================ */
const CAMP = { s: null, live: null, ui: 'hub', sel: null, snap: null, ordDraft: {} };
let _cr = 1;
function crand() { _cr = (_cr * 1664525 + 1013904223) >>> 0; return _cr / 4294967296; }
const cdeep = o => JSON.parse(JSON.stringify(o));
const lbs = n => (Math.round(n * 10) / 10).toFixed(1);
function campSave() { if (CAMP.s) store('camp', CAMP.s); }
function campLoad() { const s = store('camp'); if (s && s.v === 1) { CAMP.s = s; _cr = s.seed || 1; } }
function campReset() { CAMP.s = null; CAMP.live = null; CAMP.ui = 'hub'; store('camp', null); try { localStorage.removeItem('gh_camp'); } catch (e) { } }
function poolWeight(p) { return packWeight(p); }
function newCampaign(mode) {

  CAMP.s = { v: 1, phase: 'load', day: 1, mode, seed: 7001 + Math.floor(Math.random() * 90000), pack: q, pool: {}, site: null, moves: 0, orders: [], results: [], patients: [], wave: 0, tri: { pairs: 0, ok: 0 }, stats: { harass: 0, storms: 0, spoiled: 0, abandoned: 0, daysThreat: 0 }, settling: false, log: [], mas: null, report: null, ordersToday: { lb: 0, lines: 0 } };
  _cr = CAMP.s.seed; campSave();
}
function clog(t) { CAMP.s.log.unshift({ d: CAMP.s.day, t }); if (CAMP.s.log.length > 60) CAMP.s.log.pop(); }

/* ---------- entry ---------- */
function renderCampaign(root) {
  if (CAMP.live && SIM.G) { CAMP.resume(root); return; }
  if (!CAMP.s) campLoad();
  const s = CAMP.s;
  if (MAS.active) { MAS.render(root); return; }
  if (!s) return renderCampIntro(root);
  ({ load: renderLoad, site: r => renderSiteStep(r, 'first'), move: r => renderSiteStep(r, 'forced'), day: renderHub, final: renderFinal })[s.phase](root);
}
function renderCampIntro(root) {
  const hasOld = !!store('camp');
  root.innerHTML = `<div class="page-h"><p class="eyebrow">Campaign</p><h1>Operation IRON LANTERN</h1><p>A ten-day war in the Republic of Sarev. You lead a special operations surgical team, flown in by AFSOC to support a joint task force. You choose what to carry, where to set up your casualty collection point, and which casualty to treat first. The enemy keeps advancing, so you will have to move. On day 10 the whole front arrives at once.</p></div>
  <div class="camp-grid">
    <section class="panel pad"><h2>How it works</h2>
      <ol class="how">
        <li><b>Load-out.</b> Packs hold ${CAMP_CAP} lb. Every item has a weight. Choose what to carry.</li>
        <li><b>Set up.</b> Pick a site on the map. Closer to the front means fresher casualties and more danger. Farther back is safe but casualties arrive sicker and later.</li>
        <li><b>Each day.</b> A few casualties arrive, more and worse as the days go on. Treat them with the full simulator. When two arrive together, you choose who comes first.</li>

        <li><b>Day 10.</b> A mass casualty. Several patients at once, in several windows, with triage tags and limited helicopters.</li>
      </ol></section>
    <section class="panel pad"><h2>Start</h2>
      <p class="muted">Difficulty applies to every casualty: Guided has the coach and monitors on, Standard has neither, Realistic bleeds faster with limited supplies.</p>
      <div class="seg lg" role="group" aria-label="Difficulty">${['guided', 'standard', 'realistic'].map(m => `<button data-mode="${m}" aria-pressed="${APP.mode === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div>
      <div class="row"><button class="btn primary" id="c-new">${hasOld ? 'Start a new campaign' : 'Begin the campaign'}</button>${hasOld ? '<button class="btn" id="c-cont">Continue saved campaign</button>' : ''}</div>

/* ---------- logistics: load-out ---------- */
function renderLoad(root) {

    <aside class="load-side"><div class="panel pad sticky">
      <div class="lgauge ${over ? 'over' : ''}" role="img" aria-label="Pack weight ${lbs(w)} of ${CAMP_CAP} pounds"><div class="gbar"><i style="width:${pct}%"></i></div><div class="gl"><b>${lbs(w)}</b> / ${CAMP_CAP} lb</div></div>
      <p class="muted sm">${over ? `<b class="crit">Over by ${lbs(w - CAMP_CAP)} lb.</b> Remove something.` : `${lbs(CAMP_CAP - w)} lb free.`}</p>
      <div class="packs">${team.map((r, i) => { const part = Math.min(100, Math.round(100 * Math.min(w, CAMP_CAP) / CAMP_CAP)); return `<div class="pk-m"><span>${r}</span><div class="gbar sm"><i style="width:${part}%"></i></div></div>`; }).join('')}</div>
      <h3>Presets</h3><div class="row wrap">${Object.keys(PRESETS).map(k => `<button class="btn sm" data-pre="${k}" title="${esc(PRESETS[k].note)}">${PRESETS[k].label}</button>`).join('')}</div>
      <h3>Check your load</h3><ul class="adv">${packAdvice(s.pack).map(([c, t]) => `<li class="${c}"><span aria-hidden="true">${c === 'ok' ? '✓' : c === 'bad' ? '!' : '•'}</span>${esc(t)}</li>`).join('')}</ul>
      <button class="btn primary wide" id="ld-go" ${over || w <= 0 ? 'disabled' : ''}>${over ? 'Over the weight limit' : 'Confirm load-out'}</button>
    </div></aside></div>`;
  const upd = (k, v) => { v = clamp(Math.round(v) || 0, 0, 60); if (v) s.pack[k] = v; else delete s.pack[k]; campSave(); renderLoadKeep(root); };

    const k = r.dataset.k, inp = r.querySelector('input');
    r.querySelectorAll('[data-d]').forEach(b => b.onclick = () => upd(k, (s.pack[k] || 0) + (+b.dataset.d) * (STEP[k] || 1)));
    inp.onchange = () => upd(k, +inp.value);
  });
  root.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { s.pack = cdeep(PRESETS[b.dataset.pre].q); campSave(); renderLoadKeep(root); });
  $('#ld-go').onclick = () => { s.pool = cdeep(s.pack); s.phase = 'site'; clog('Packs loaded: ' + lbs(poolWeight(s.pool)) + ' lb.'); campSave(); renderCampaign(root); };
}
function renderLoadKeep(root) { const y = window.scrollY, lt = ($('.load-items') || {}).scrollTop; renderLoad(root); window.scrollTo(0, y); }

/* ---------- map ---------- */
function mapSVG(day, curId, selId, opts) {
  opts = opts || {};
  const F = FRONT[day - 1], en = frontPolygon(F), shell = frontPolygon(F + SHELL_RANGE), warn = frontPolygon(F + WARN_RANGE);

  const mk = SITES.map((st, i) => {
    const m = siteMargin(st, day), st2 = m <= SHELL_RANGE ? 'danger' : m <= WARN_RANGE ? 'warn' : 'safe';

    <g class="ridge"><path d="M 330 40 q 40 -22 80 0 q 40 20 90 -10"/><path d="M 120 190 q 40 -26 90 -6 q 40 14 70 -8"/><path d="M 560 430 q 50 -26 100 0 q 50 20 110 -8"/></g>
    <polygon points="${poly(warn)}" class="zwarn"/><polygon points="${poly(shell)}" class="zshell"/><polygon points="${poly(en)}" class="zen"/><polygon points="${poly(en)}" fill="url(#hatch)" class="zhat"/>

    <g class="lz"><rect x="${LZ.x - 13}" y="${LZ.y - 13}" width="26" height="26" rx="3"/><text x="${LZ.x}" y="${LZ.y + 4}" text-anchor="middle">LZ</text><text x="${LZ.x - 13}" y="${LZ.y + 30}" class="ml">${esc(LZ.name)}</text></g>
    ${mk}
    <g class="legend" transform="translate(${MAP_W - 206},${MAP_H - 72})"><rect width="196" height="62" rx="6"/><rect x="8" y="9" width="14" height="10" class="zen"/><text x="28" y="18">Enemy ground</text><rect x="8" y="25" width="14" height="10" class="zshell"/><text x="28" y="34">Artillery range (must leave)</text><rect x="8" y="41" width="14" height="10" class="zwarn"/><text x="28" y="50">Harassing fire likely</text></g>
  </svg>`;
}
function siteCard(st, day, forced) {
  const s = CAMP.s, m = siteMargin(st, day), evac = siteEvac(st, day) + (s.settling ? 0 : 0), risk = siteRisk(st, day), cur = s.site === st.id;

  let move = '';

  }
  return `<div class="sitecard"><h3>${esc(st.name)}</h3><p>${esc(st.desc)}</p>

/* ---------- day cycle ---------- */

/* ---------- resupply ---------- */

}
CAMP.resume = function (root) { mountSim(root); SIM.started = true; startSimLoop(); };
function abandonLive() { if (!CAMP.live) return; if (CAMP.snap && CAMP.s) { CAMP.s.pool = CAMP.snap; } CAMP.live = null; SIM.camp = null; stopSim(); }
function campPatientEnd(G) {

/* ---------- full view ---------- */
MAS.focus = function (i) {

/* ---------- finish ---------- */
function shiftTimes(G, off) {
  if (!off) return; G.hist.forEach(h => h.t -= off); G.pen.forEach(x => x.t -= off); G.t -= off; if (G.flags.firstProductT != null) G.flags.firstProductT -= off; if (G.P.txaT != null) G.P.txaT -= off; (G.P.tqs || []).forEach(q => { if (q.t != null) q.t -= off; });
}

<script>
'use strict';
/* ============================================================
   APP SHELL — routing, theme, Academy, Operating Room, Reference
   ============================================================ */
const APP = { mode: 'guided', view: 'academy', arg: null, mute: false };
const md = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const VIEWS = [['academy', 'Academy'], ['sim', 'Field Sim'], ['campaign', 'Campaign'], ['or', 'Operating Room'], ['ref', 'Reference']];

/* ---------- theme ---------- */
function applyTheme(t) { const h = document.documentElement; if (t === 'light' || t === 'dark') h.setAttribute('data-theme', t); else h.removeAttribute('data-theme'); }
function cycleTheme() { const order = ['system', 'light', 'dark'], c = store('theme') || 'system', n = order[(order.indexOf(c) + 1) % 3]; store('theme', n); applyTheme(n); $('#theme-b').textContent = 'Theme: ' + n; }

/* ---------- router ---------- */
APP.go = function (view, arg) { const h = '#' + view + (arg ? '/' + arg : ''); if (location.hash === h) APP.render(); else location.hash = h; };

APP.startSc = function (id) { APP.view = 'sim'; if (location.hash !== '#sim') history.replaceState(null, '', '#sim'); document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === 'sim')); startScenario(id); };

/* ---------- glossary tooltips (first use only) ---------- */
function glossify(root) {
  const terms = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length), used = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.gl,button,h1,h2,h3,.dgw,svg,.quiz,.call.warn b') ? NodeFilter.FILTER_REJECT : (n.nodeValue.trim().length > 3 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);

    const re = new RegExp('(^|[^A-Za-z0-9])(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![A-Za-z0-9])', 'i');

      const b = document.createElement('button'); b.className = 'gl'; b.type = 'button'; b.dataset.t = t; b.textContent = txt; after.replaceWith(b);
      nodes.push(rest); used.add(t.toLowerCase()); break;
    }
  });

/* ---------- academy ---------- */
function progress() { return store('progress') || {}; }
function renderAcademy(root, arg) {

  const pr = progress(), all = allLessons(), done = all.filter(l => pr[l.id] && pr[l.id].done).length, start = store('start');
  const next = all.find(l => !(pr[l.id] && pr[l.id].done) && (!start || l.level >= start)) || all[0];
  const rec = { start: 'L0', new: 'L1', medic: 'L2', clinician: 'L3' };

  <section class="start"><h2>Where are you starting?</h2><div class="who" role="group" aria-label="Your experience">${[['start', 'Brand new', 'I have never studied medicine.'], ['new', 'Some first aid', 'I know basic first aid or CPR.'], ['medic', 'Combat lifesaver or medic', 'I know tourniquets and MARCH.'], ['clinician', 'Clinician', 'I am a nurse, physician or surgeon.']].map(([k, t, d]) => `<button class="whoo ${store('who') === k ? 'on' : ''}" data-who="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>

  };
}

/* ---------- operating room ---------- */
function renderOR(root) {

  const best = id => sc[id] != null ? `<span class="best">Best ${sc[id]}</span>` : '<span class="best none">Not tried</span>';
  root.innerHTML = `<div class="page-h"><h1>Operating Room</h1><p>Practice the procedures here, or meet them inside a Field Sim case. You can also play the damage-control laparotomy on its own. Pick a difficulty first.</p></div>
  <div class="modebar"><div class="seg lg" role="group" aria-label="Difficulty">${['guided', 'standard', 'realistic'].map(m => `<button data-mode="${m}" aria-pressed="${APP.mode === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div><p>Guided shows hints. Standard and Realistic do not.</p></div>
  <h2>Operations</h2><div class="cards">${SURG.PROC_LIST.map(([id, t, d]) => `<article class="card"><h3>${esc(t)}</h3><p>${esc(d)}</p><div class="sc-foot"><button class="btn primary" data-proc="${id}">Practice</button>${best(id)}</div></article>`).join('')}</div>
  <h2>Skills Lab</h2><div class="cards sm">${SURG.SKILL_LIST.map(([id, t]) => `<article class="card"><h3>${esc(t)}</h3><p>${esc(SURG.SKILLS[id].base)}</p><div class="sc-foot"><button class="btn" data-proc="${id}">Practice</button>${best(id)}</div></article>`).join('')}</div>`;
  root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { APP.mode = b.dataset.mode; store('mode', APP.mode); renderOR(root); });
  root.querySelectorAll('[data-proc]').forEach(b => b.onclick = () => {
    const id = b.dataset.proc;
    SURG.launch(id, SURG.snapFor(id), { mode: APP.mode, practice: true }, res => { if (res && !res.aborted) { const s = store('orscores') || {}; s[id] = Math.max(s[id] || 0, res.score); store('orscores', s); } renderOR(root); });
  });
}

/* ---------- reference ---------- */
function renderRef(root, arg) {
  const tab = arg || 'formulary';
  const tabs = [['formulary', 'Formulary'], ['cpg', 'Guidelines'], ['glossary', 'Glossary'], ['calc', 'Calculators']];
  root.innerHTML = `<div class="page-h"><h1>Reference</h1><p>Quick lookups. Always confirm doses against current guidelines and local protocols.</p></div><div class="seg" role="tablist" aria-label="Reference sections">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" data-t="${k}">${t}</button>`).join('')}</div><div id="ref-body"></div>`;
  root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => APP.go('ref', b.dataset.t));
  const rb = $('#ref-body');
  if (tab === 'formulary') {
    rb.innerHTML = `<input class="search" id="rf-q" type="search" placeholder="Search drugs" aria-label="Search drugs"><div class="cards sm" id="rf-l"></div>`;
    const draw = q => { $('#rf-l').innerHTML = FORMULARY.filter(d => (d.n + d.c + d.u).toLowerCase().includes(q.toLowerCase())).map(d => `<article class="card"><h3>${esc(d.n)}</h3><p class="muted">${esc(d.c)}</p><dl class="dl"><dt>Dose</dt><dd>${esc(d.d)}</dd><dt>Use</dt><dd>${esc(d.u)}</dd><dt>Careful</dt><dd>${esc(d.w)}</dd><dt>Source</dt><dd>${esc(d.s)}</dd></dl></article>`).join('') || '<p class="muted">No match.</p>'; };
    draw(''); $('#rf-q').oninput = e => draw(e.target.value);
  } else if (tab === 'cpg') {
    rb.innerHTML = `<p>These are the Joint Trauma System Clinical Practice Guidelines that the cases are built on. Links open the official documents. <a href="${CPG_INDEX_URL}" target="_blank" rel="noopener noreferrer">All JTS guidelines</a></p>${CPG_LIBRARY.map(g => `<h2>${esc(g.g)}</h2><ul class="cpgl">${g.items.map(i => `<li><a href="${esc(i[1])}" target="_blank" rel="noopener noreferrer">${esc(i[0])}</a> <span class="muted">${esc(i[2])}</span>${i[3] && lessonById(i[3]) ? ` · <a href="#academy/${i[3]}">Lesson</a>` : ''}</li>`).join('')}</ul>`).join('')}`;
  } else if (tab === 'glossary') {
    rb.innerHTML = `<input class="search" id="gl-q" type="search" placeholder="Search terms" aria-label="Search terms"><dl class="dl big" id="gl-l"></dl>`;
    const draw = q => { $('#gl-l').innerHTML = Object.keys(GLOSSARY).sort((a, b) => a.localeCompare(b)).filter(k => (k + GLOSSARY[k]).toLowerCase().includes(q.toLowerCase())).map(k => `<dt>${esc(k)}</dt><dd>${esc(GLOSSARY[k])}</dd>`).join('') || '<p class="muted">No match.</p>'; };
    draw(''); $('#gl-q').oninput = e => draw(e.target.value);
  } else {
    rb.innerHTML = `<div class="cards sm">
    <article class="card"><h3>Burn fluids: Rule of 10</h3><label>Burn size, % TBSA <input type="number" id="c-tb" min="1" max="100" value="30"></label><label>Weight, kg <input type="number" id="c-kg" min="20" max="200" value="80"></label><p class="out" id="c-o1"></p><p class="muted">Start rate = % TBSA × 10 mL/h (for 40–80 kg). Add 100 mL/h for every 10 kg above 80. Adjust to urine output 0.5 mL/kg/h.</p></article>
    <article class="card"><h3>Shock index</h3><label>Heart rate <input type="number" id="c-hr" value="120"></label><label>Systolic BP <input type="number" id="c-sb" value="90"></label><p class="out" id="c-o2"></p><p class="muted">HR ÷ SBP. Over 0.9 suggests significant hemorrhage; over 1.4 suggests critical shock.</p></article>
    <article class="card"><h3>Mean arterial pressure</h3><label>Systolic <input type="number" id="c-s" value="100"></label><label>Diastolic <input type="number" id="c-d" value="60"></label><p class="out" id="c-o3"></p><p class="muted">(SBP + 2 × DBP) ÷ 3. Aim for a MAP of at least 65 in resuscitation, lower and permissive before bleeding control.</p></article>
    <article class="card"><h3>Glasgow Coma Scale</h3><label>Eyes <select id="g-e"><option value="4">4 open</option><option value="3">3 to voice</option><option value="2">2 to pain</option><option value="1">1 none</option></select></label><label>Verbal <select id="g-v"><option value="5">5 oriented</option><option value="4">4 confused</option><option value="3">3 words</option><option value="2">2 sounds</option><option value="1">1 none</option></select></label><label>Motor <select id="g-m"><option value="6">6 obeys</option><option value="5">5 localizes</option><option value="4">4 withdraws</option><option value="3">3 flexion</option><option value="2">2 extension</option><option value="1">1 none</option></select></label><p class="out" id="c-o4"></p></article></div>`;
    const u = () => {
      const tb = +$('#c-tb').value, kg = +$('#c-kg').value; $('#c-o1').textContent = `Start at ${Math.round(tb * 10 + Math.max(0, Math.floor((kg - 80) / 10)) * 100)} mL/h`;
      const si = +$('#c-hr').value / Math.max(1, +$('#c-sb').value); $('#c-o2').textContent = `Shock index ${si.toFixed(2)} · ${si > 1.4 ? 'critical' : si > 0.9 ? 'concerning' : 'normal range'}`;
      $('#c-o3').textContent = `MAP ${Math.round((+$('#c-s').value + 2 * +$('#c-d').value) / 3)} mmHg`;
      const g = +$('#g-e').value + +$('#g-v').value + +$('#g-m').value; $('#c-o4').textContent = `GCS ${g} · ${g <= 8 ? 'severe, protect the airway' : g <= 12 ? 'moderate' : 'mild'}`;
    };
    rb.querySelectorAll('input,select').forEach(e => e.oninput = u); u();
  }
}

/* ---------- boot ---------- */
function boot() {
  APP.mode = store('mode') || 'guided';
  applyTheme(store('theme') || 'system');
  const app = $('#app');
  app.innerHTML = `<header class="top"><a class="brand" href="#academy"><span class="logo" aria-hidden="true">+</span><span>Golden Hour<small>Trauma Sim</small></span></a><nav id="nav" aria-label="Main">${VIEWS.map(([v, t]) => `<a href="#${v}" data-v="${v}">${t}</a>`).join('')}</nav><button class="btn ghost sm" id="theme-b">Theme: ${store('theme') || 'system'}</button></header><main id="view" tabindex="-1"></main><footer class="foot"><p><b>Teaching simulator, not medical advice.</b> Built from public Joint Trauma System Clinical Practice Guidelines and TCCC guidance, simplified for learning. It does not replace hands-on training, current guidelines, or medical direction.</p></footer>`;
  $('#theme-b').onclick = cycleTheme;
  window.addEventListener('hashchange', () => APP.render());
  window.addEventListener('resize', () => { if (typeof monResize === 'function' && MON.canvas && MON.canvas.isConnected) monResize(); });
  APP.render();
}
boot();
</script>

</body></html>
