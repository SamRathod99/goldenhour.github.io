<title>Golden Hour Trauma Sim</title>
<meta name="description" content="Learn emergency trauma care from first aid to damage-control surgery, in a physiology-driven special operations surgical team simulator.">

<style>

--accent:#43c4a8;--accent-ink:#06201a;--ok:#5cd685;--warn:#f0a13a;--crit:#ff6f66;--info:#6db6ff;--body:#2a342e;
--mon-bg:#070b09;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{
--bg:#0f1512;--surface:#171f1b;--surface-2:#202a25;--line:#2f3b35;--text:#e8ece6;--muted:#9aa89f;
--accent:#43c4a8;--accent-ink:#06201a;--ok:#5cd685;--warn:#f0a13a;--crit:#ff6f66;--info:#6db6ff;--body:#2a342e;
--mon-bg:#070b09;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--font)}
body.noscroll{overflow:hidden}

h1{font-size:1.9rem}h2{font-size:1.3rem;margin-top:1.6em}h3{font-size:1.1rem}h4{font-size:.95rem;margin:1em 0 .4em}
p{margin:0 0 .9em}a{color:var(--accent)}
.muted,small{color:var(--muted)}
.eyebrow{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .3em}

button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
/* header */

.btn.primary:hover{filter:brightness(1.08)}

.cpgl{padding-left:1.1em}.cpgl li{margin:.4em 0}

.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}

.call{border-left:4px solid var(--info);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:1em 0}

.sim{display:flex;flex-direction:column;gap:12px}
.simbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;position:sticky;top:58px;z-index:10}

.sb-speed{display:flex;gap:4px;flex-wrap:wrap}.sb-speed button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 11px;font-weight:600;min-height:36px}.sb-speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.sub-h{font-weight:700;margin:12px 0 6px}.sub-h small{font-weight:500}
.pat-body{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px}
.bodywrap .body{width:100%;height:auto;max-height:420px}
.wm circle:first-child{fill:var(--muted);stroke:var(--surface);stroke-width:2}.wm .halo{fill:none;stroke:transparent;stroke-width:2}
.wm{cursor:pointer}.wm.bleed circle:first-child{fill:var(--crit)}.wm.bleed .halo{stroke:var(--crit);animation:pulse 1.2s infinite}

.wounds .dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}.wounds .bleed .dot{background:var(--crit)}.wounds .ooze .dot{background:var(--warn)}.wounds .ctrl .dot{background:var(--ok)}.wounds .burn .dot{background:#c8691f}

.atmist{margin-top:12px;font-size:.88rem}.atmist summary{cursor:pointer;font-weight:700}

.mon{background:var(--mon-bg);border-color:var(--mon-line);color:#dfe8e3}

.v{border:1px solid var(--mon-line);border-radius:8px;padding:6px 9px;background:#0a0f0d}.v label{margin:0;font:600 .66rem var(--mono);color:var(--mon-dim);text-transform:uppercase;display:block}
.v b{font:700 1.7rem/1.1 var(--mono)}.v small{display:block;font-size:.66rem;color:var(--mon-dim)}
.v.hr b{color:var(--ecg)}.v.sp b{color:var(--spo2)}.v.bp b{color:var(--abp)}.v.rr b,.v.co b{color:var(--resp)}.v.tp b,.v.uo b{color:#d6e0da}
.v.warn b{color:#ffc266}.v.crit b{color:#ff6b6b;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}
.coach{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:var(--r);padding:12px 14px}

.coach-t{font-weight:700;margin:.3em 0}.coach-w{font-size:.9rem;color:var(--muted)}
.logp .log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;font-size:.88rem;display:flex;flex-direction:column;gap:4px}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.role{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--bg);font-size:.8rem}.role.busy{border-color:var(--warn)}
.role-h{display:flex;gap:6px;align-items:baseline}.role-h b{font:700 .85rem var(--mono)}.role-h span{color:var(--muted);font-size:.72rem}.role-t{min-height:1.2em;margin:3px 0}
.bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--warn);transition:width .3s}
.active{display:grid;gap:5px;margin-bottom:8px}.task{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;padding:5px 8px;border-radius:7px;background:var(--surface-2)}
.cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.cats button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-weight:600;font-size:.82rem;min-height:34px}

.actsearch{margin-bottom:8px}.actsearch input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}

.act-main:hover{background:var(--surface-2);border-radius:9px}.ad{font:500 .72rem var(--mono);color:var(--muted);flex:none}
.adv{font:700 .6rem var(--mono);margin-left:6px;padding:1px 5px;border-radius:5px;background:var(--surface-2);color:var(--muted);font-style:normal;text-transform:uppercase}
.act-i{border:0;border-left:1px solid var(--line);background:transparent;width:38px;font:italic 700 1rem serif;color:var(--muted)}
.act.dis .act-main{opacity:.55}.act.rec{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}.act.flash{animation:flash 1.4s}@keyframes flash{30%{background:color-mix(in srgb,var(--warn) 40%,transparent)}}
.why{grid-column:1 / -1;padding:0 11px 8px;font-size:.78rem;color:var(--crit)}
.act-info{grid-column:1 / -1;padding:8px 12px 10px;font-size:.86rem;border-top:1px dashed var(--line)}.meta{font-size:.78rem;color:var(--muted);margin:.2em 0}.meta.cpg{color:var(--warn)}
.picker{display:grid;gap:6px}.picker-h{display:flex;justify-content:space-between;align-items:center}.picker-p{color:var(--muted);margin:.2em 0}
.pk{border:1px solid var(--accent);background:var(--bg);border-radius:9px;padding:10px 12px;text-align:left;font-weight:600;min-height:42px}.pk:hover{background:var(--surface-2)}
.sup{margin-top:10px;font-size:.85rem}.sup summary{cursor:pointer;font-weight:700}.sup ul{columns:2;padding-left:1.1em;margin:.4em 0}.sup .low{color:var(--warn)}.sup .out{color:var(--crit);font:inherit;text-decoration:line-through}
.empty{color:var(--muted);padding:8px}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:100;transition:.25s;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.warn{background:var(--warn);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:90;overflow:auto}
.modal-card{background:var(--surface);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.brief .mode-note{background:var(--surface-2);padding:10px 12px;border-radius:9px;font-size:.9rem}
/* ===== AAR ===== */
.aar{max-width:1000px;margin:0 auto}.aar section{margin-top:26px}
.aar-top{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:14px 0}

.aar-facts{display:flex;gap:26px;flex-wrap:wrap}.aar-facts div{display:flex;flex-direction:column}.aar-facts b{font:700 1.6rem var(--mono)}.aar-facts span{font-size:.8rem;color:var(--muted)}
.objs{list-style:none;padding:0;margin:0;display:grid;gap:7px}.objs li{display:flex;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.objs .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:#fff;background:var(--muted)}.objs .ok .mk{background:var(--ok)}.objs .miss .mk{background:var(--crit)}
.objs em{font:600 .78rem var(--mono);color:var(--muted);font-style:normal;margin-left:6px}.objs p{margin:.2em 0 0;font-size:.88rem;color:var(--muted)}
.teach{padding-left:1.2em}.teach li{margin:.5em 0}.rel{font-size:.9rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.ch{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;position:relative}
.ch figcaption{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:4px}.ch figcaption span{color:var(--muted);font-size:.78rem}
.ch svg{width:100%;height:auto;display:block;touch-action:pan-y}.ch .gl{stroke:var(--line);stroke-width:1}.ch .ax{fill:var(--muted);font:10px var(--mono)}
.ch .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ch .th{stroke:var(--warn);stroke-width:1.3;stroke-dasharray:4 4}.ch .th-t{fill:var(--warn)}
.ch .xh{stroke:var(--muted);stroke-width:1}.ch .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .tip{position:absolute;top:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);font:600 .75rem var(--mono);padding:3px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
.dd{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;background:var(--surface);border:1px dashed var(--muted);border-radius:var(--r);padding:14px}
ol.rec{padding-left:1.3em;margin:0;font-size:.9rem}ol.rec time{font:600 .75rem var(--mono);color:var(--muted);margin-right:6px}
.aar-act{margin:28px 0}
/* ===== Operating room overlay ===== */
.or-overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.or-head{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}.or-head>div:first-child{flex:1}.or-head h2{margin:0;font-size:1.15rem}
.or-clock{font:700 .9rem var(--mono);color:var(--muted)}
.or-body{flex:1;overflow:auto;padding:16px}
.or-grid{display:grid;gap:16px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}
@media (min-width:900px){.or-grid{grid-template-columns:1.4fr 1fr}}
.or-side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;align-self:start}
.stepwrap{max-width:680px;margin:0 auto}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{height:5px;flex:1;background:var(--surface-2);border-radius:9px}.dots i.d{background:var(--ok)}.dots i.n{background:var(--accent)}
.q{font-size:1.05rem}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:600;min-height:46px}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt.sel,.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}.opt.wrongc{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,var(--surface))}
.opt:disabled{opacity:.7;cursor:default}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.seq{padding-left:1.4em;margin:8px 0}.seq li{margin:3px 0;color:var(--ok);font-weight:600}
.svgbox{max-width:380px;margin:10px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.fb{padding:11px 14px;border-radius:10px;margin:12px 0;border:1px solid}.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.fb.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent)}
.hint{font-size:.9rem;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
.meter{position:relative;height:38px;background:var(--surface-2);border-radius:10px;border:1px solid var(--line);margin:18px 0;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 40%,transparent)}.meter .cur{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--text);left:0}
.gauge{display:grid;grid-template-columns:90px 1fr 74px;gap:8px;align-items:center;font-size:.8rem;margin:6px 0}.gauge .gb{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}.gauge .gb i{display:block;height:100%;background:var(--ok)}
.gauge.bad .gb i{background:var(--crit)}.gauge b{font:700 .78rem var(--mono);text-align:right}.gauge.bad b{color:var(--crit)}
.triad-m.danger{outline:2px solid var(--crit);outline-offset:4px;border-radius:6px}
.alert{background:color-mix(in srgb,var(--crit) 14%,transparent);border:1px solid var(--crit);padding:8px 10px;border-radius:9px;font-size:.85rem;font-weight:600}
.bleedn{font-size:.9rem;margin:.5em 0}
.anes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.orlog{list-style:none;padding:0;margin:0;font-size:.82rem;display:grid;gap:4px}.orlog li{padding:3px 6px;border-left:3px solid var(--line)}.orlog .ok{border-color:var(--ok)}.orlog .warn{border-color:var(--warn)}.orlog .bad,.orlog .crit{border-color:var(--crit)}.orlog time{font:600 .72rem var(--mono);color:var(--muted)}
.abd .zone.q rect{transition:fill-opacity .2s}
.inj{display:grid;gap:10px;margin:12px 0}.inj-c{border:1px solid var(--crit);border-radius:10px;padding:10px 12px;background:var(--surface)}.inj-c p{margin:.2em 0 .5em;font-size:.88rem;color:var(--muted)}.inj-c em{font-style:normal;color:var(--muted);font-size:.8rem}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.step-n{display:flex;align-items:center;gap:14px;margin:8px 0}.step-n b{font:700 1.6rem var(--mono);min-width:2ch;text-align:center}
@media (max-width:700px){#nav{order:3;flex-basis:100%}.simbar{top:0;position:static}}
@media (max-width:560px){h1{font-size:1.55rem}.pat-body{grid-template-columns:110px 1fr}.sb-clock b{font-size:1rem}.sup ul{columns:1}.gauge{grid-template-columns:78px 1fr 64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* dose entry */
.dose h2{margin-top:0}.dose .routes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.dose .routes .opt{min-height:38px;padding:6px 14px}
.dfield{display:block;margin-top:12px}.dfield input{font:700 1.4rem var(--mono);margin-top:4px}
.calc{font:600 .95rem var(--mono);color:var(--accent);min-height:1.4em;margin:.3em 0}.sm{font-size:.82rem}
.warnline{color:var(--warn);font-weight:600;min-height:1.3em}.dose details{margin:.4em 0}.dose summary{cursor:pointer;color:var(--accent);font-weight:600}
.dose-m .modal-card{max-width:520px}

/* hands-on scenes */
.scn-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.scn-h b{font-size:1.05rem}.scn-h span{font:600 .8rem var(--mono);color:var(--muted)}
.scn-svg{max-width:420px;margin:8px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.scn-m{min-height:1.4em;color:var(--warn);font-weight:600}
.scn-log{list-style:none;padding:0;margin:8px 0;display:grid;gap:3px;font-size:.88rem}.scn-log li{padding:3px 8px;border-left:3px solid var(--ok)}.scn-log li.bad{border-color:var(--crit);color:var(--crit)}
.hintring{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;animation:ring 1.2s infinite}@keyframes ring{50%{opacity:.35}}
.hazard{fill:var(--crit);fill-opacity:.12;stroke:var(--crit);stroke-width:1.5;stroke-dasharray:3 3}
.guide{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:2 6;stroke-linecap:round}
.ep{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:2}.ep.end{fill:var(--ok);stroke:var(--ok)}
.strokeline{fill:none;stroke:var(--crit);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.track{stroke:var(--line);stroke-width:8;stroke-linecap:round}.trackzone{stroke:var(--ok);stroke-opacity:.5;stroke-width:8;stroke-linecap:round}
.handle{fill:var(--accent);stroke:var(--bg);stroke-width:3;cursor:grab}
.turnarc{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round}
.tapmark{fill:none;stroke-width:3;animation:fade .7s forwards}.tapmark.ok{stroke:var(--ok)}.tapmark.bad{stroke:var(--crit)}@keyframes fade{to{opacity:0;transform:scale(1.6);transform-origin:center;transform-box:fill-box}}
.dragit{cursor:grab}.stitch{fill:var(--text)}
.spurt{animation:pulse .8s infinite}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.6}
/* ===== Campaign ===== */
.camp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.camp-grid.hub{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.pad{padding:18px}.col{display:flex;flex-direction:column;gap:8px}.wide{width:100%}.wrap{flex-wrap:wrap}.sm{font-size:.88rem}
.how{padding-left:1.2em;margin:.4em 0}.how li{margin:.45em 0}
.note{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--surface);border-radius:8px;padding:9px 12px;margin:10px 0}
.note.ok{border-left-color:var(--ok)}.note.warn{border-left-color:var(--warn)}
.daybar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.daybar h1{margin:.2em 0 .5em}
.dots{display:flex;gap:6px}.dots i{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.dots i.past{background:var(--accent);border-color:var(--accent)}.dots i.now{background:var(--warn);border-color:var(--warn)}.dots i.mas{border-color:var(--crit)}
.dstat{display:flex;flex-wrap:wrap;gap:8px 26px}.dstat label{display:block;font:600 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.dstat b{font-weight:650}
.inb{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.inc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.inc-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.inc-h span{color:var(--muted);font-size:.85rem}
.inc dl{margin:0 0 10px;display:grid;grid-template-columns:90px 1fr;gap:3px 8px;font-size:.88rem}.inc dt{color:var(--muted)}.inc dd{margin:0}
.res{list-style:none;padding:0;margin:.4em 0}.res li{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;margin:5px 0;background:var(--bg)}
.res li.bad{border-left-color:var(--crit)}.res li em{margin-left:auto;color:var(--muted);font-style:normal;font-size:.88rem}
.side{display:flex;flex-direction:column;gap:12px}.side h3{margin-top:0}
.chipw{font:600 .7rem var(--mono);color:var(--warn);margin-left:6px}
.stk details{border-top:1px solid var(--line);padding:4px 0}.stk summary{cursor:pointer;font-weight:600;padding:4px 0}
.stk ul{list-style:none;margin:0 0 6px;padding:0}.stk li{display:flex;justify-content:space-between;font-size:.86rem;padding:2px 0}.stk li.low b{color:var(--warn)}.stk li.out b{color:var(--crit)}.stk li.out span{text-decoration:line-through;color:var(--muted)}
.ord{list-style:none;margin:0;padding:0}.ord li{display:flex;flex-direction:column;font-size:.85rem;padding:5px 0;border-top:1px solid var(--line)}.ord li:first-child{border-top:0}.ord span{color:var(--muted)}
.clog{margin:0;padding-left:0;list-style:none;font-size:.82rem}.clog li{padding:3px 0;border-top:1px solid var(--line)}.clog em{font:600 .7rem var(--mono);color:var(--muted);margin-right:4px;font-style:normal}
/* load-out */
.load{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.load-items{display:flex;flex-direction:column;gap:12px}
.sticky{position:sticky;top:76px}
.irows{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}.irow:first-child{border-top:0}
.irow.has{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.irow .in b{display:block;font-weight:600;font-size:.94rem}.irow .in small{font-size:.76rem}
.irow .iw{text-align:right;font:600 .78rem var(--mono);color:var(--muted)}
.stp{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.stp button{width:36px;height:36px;border:0;background:var(--surface-2);font-size:1.2rem;font-weight:700;line-height:1}.stp button:hover{background:var(--line)}
.stp input{width:46px;border:0;text-align:center;background:transparent;color:inherit;font:600 .95rem var(--mono);-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.lgauge{margin:0 0 6px}.lgauge .gbar{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.lgauge .gbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.lgauge.over .gbar i{background:var(--crit)}.lgauge .gl{font:500 .9rem var(--mono);margin-top:4px}.lgauge .gl b{font-size:1.4rem}
.packs{display:grid;gap:5px;margin:8px 0 4px}.pk-m{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;font:600 .72rem var(--mono);color:var(--muted)}
.gbar.sm{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}.gbar.sm i{display:block;height:100%;background:var(--info)}
.adv{list-style:none;padding:0;margin:0 0 12px;font-size:.86rem}.adv li{display:flex;gap:8px;padding:4px 0}.adv li span{width:14px;text-align:center;font-weight:800}
.adv li.bad span{color:var(--crit)}.adv li.warn span{color:var(--warn)}.adv li.ok span{color:var(--ok)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:16px;align-items:start}
.mapbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .land{fill:var(--surface-2)}
.mapsvg .river{fill:none;stroke:var(--info);stroke-width:7;opacity:.35;stroke-linecap:round}

.mapsvg .zen{fill:var(--crit);opacity:.2}.mapsvg .zhat{opacity:.35}.mapsvg .hl{stroke:var(--crit);stroke-width:2}
.mapsvg .zshell{fill:var(--warn);opacity:.22}.mapsvg .zwarn{fill:var(--warn);opacity:.09}
.mapsvg .zl{font:700 14px var(--mono);fill:var(--crit);letter-spacing:.1em}
.mapsvg .lz rect{fill:var(--info)}.mapsvg .lz text{font:700 12px var(--mono);fill:#fff}.mapsvg .lz .ml{fill:var(--text);font:600 12px var(--font)}
.mapsvg .site{cursor:pointer}.mapsvg .site .hit{fill:transparent}
.mapsvg .site .mk{fill:var(--ok);stroke:var(--surface);stroke-width:2}.mapsvg .site.warn .mk{fill:var(--warn)}.mapsvg .site.danger .mk{fill:var(--crit)}
.mapsvg .site .mn{font:700 12px var(--mono);fill:#fff;pointer-events:none}.mapsvg .site .ml{font:600 12px var(--font);fill:var(--text);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.mapsvg .site .mm{font:500 11px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.mapsvg .site.sel .mk{stroke:var(--text);stroke-width:3}.mapsvg .site .ring{fill:none;stroke:var(--text);stroke-width:2.5;stroke-dasharray:4 3}
.mapsvg .site:focus-visible .hit{stroke:var(--accent);stroke-width:3}
.mapsvg .legend rect:first-child{fill:var(--surface);stroke:var(--line)}.mapsvg .legend text{font:500 11px var(--font);fill:var(--text)}
.sitecard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.sd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:.88rem}.sd dt{color:var(--muted)}.sd dd{margin:0;font-weight:600}
.movecost{border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;margin:0 0 10px;font-size:.86rem}.movecost ul{margin:.3em 0 0;padding-left:1.1em}
.dd2{display:grid;grid-template-columns:200px 1fr;gap:6px 14px}.dd2 dt{color:var(--muted)}.dd2 dd{margin:0}
/* mass casualty */
.masbrief{border:2px solid var(--crit);border-radius:var(--r);padding:14px 16px;margin-top:10px;background:color-mix(in srgb,var(--crit) 6%,var(--surface))}
.mboard{display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;flex-wrap:wrap;gap:16px;align-items:center;position:sticky;top:60px;z-index:8}
.mclk{font:700 1.5rem var(--mono)}.mt-m{display:flex;gap:22px;flex:1}.mt-m label{display:block;font:600 .66rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

/* ============================== ASSESS ============================== */

A({ id: 'air_rsi', cat: 'air', name: 'RSI + endotracheal intubation', dur: 150, roles: ['CRNA', 'EP', 'SURG', 'MED'], sup: { rsi: 1 }, tgt: 'list', adv: true, opts: () => [{ v: 'ket_half', label: 'Ketamine 0.5–1 mg/kg (reduced, for shock) + rocuronium 1 mg/kg' }, { v: 'ket_full', label: 'Ketamine 2 mg/kg + rocuronium 1 mg/kg' }, { v: 'etom', label: 'Etomidate 0.3 mg/kg + rocuronium 1 mg/kg' }, { v: 'none', label: 'Paralytic only (no induction agent)' }], info: 'Rapid-sequence intubation with video laryngoscopy. Pre-oxygenate first. In shock use reduced-dose ketamine and have blood running: a full dose can drop the pressure. After the tube: bag immediately, confirm with EtCO₂, give sedation and analgesia.', cpg: 'Airway Management in Trauma', req: G => G.P.airway.device === 'ett' ? 'Already intubated.' : null, apply(G, agent) { const P = G.P; P.ettAttempts++; const g = G.mode === 'guided' ? 0.12 : G.mode === 'realistic' ? -0.04 : 0; let p = 0.9 + g - 0.5 * P.airway.blood - 0.38 * P.airway.swelling; if (P.airway.device === 'cric') p = 0; if (P.o2dev === 'room') { P.hypoxT += 0; P.spo2 = Math.max(40, P.spo2 - 9); say(G, 'warn', 'No pre-oxygenation: oxygen saturation fell during the attempt.'); } if (agent === 'none') { pen(G, 8, 'Paralyzed without sedation. The patient is aware and cannot move.'); P.awareness = 1; } if (agent === 'ket_full' && (lossFrac(P) > 0.15 || P.sbp < 100)) { P.sedHypo += 28; pen(G, 4, 'Full-dose induction in shock. Blood pressure dropped.'); } else if (agent === 'ket_full') P.sedHypo += 8; else if (agent === 'etom') P.sedHypo += 5; else if (agent === 'ket_half') P.sedHypo += lossFrac(P) > 0.3 ? 8 : 2; if (agent !== 'none') P.sedUntil = G.t + 1500; P.paralyzed = true; P.paralUntil = G.t + 2400; if (rnd() < p || p >= 1) { P.airway.device = 'ett'; P.airway.ettOK = !(G.mode === 'realistic' && rnd() < 0.12); say(G, 'ok', 'Tube passed through the cords. Start ventilating now.'); if (!P.vent.mode) say(G, 'crit', 'Patient is paralyzed and not breathing. Start bagging or the ventilator immediately.'); } else { P.intubFail++; say(G, 'warn', 'Failed attempt: cannot see the cords through blood/swelling. Patient is paralyzed. Ventilate, change plan, consider surgical cric.'); } G.flags.rsiT = G.t; return 'agent ' + agent; } });

A({ id: 'o2_nrb', cat: 'resp', name: 'Oxygen — non-rebreather mask', dur: 10, req: G => G.supplies.o2 > 0 ? null : 'No oxygen.', info: 'High-flow 15 L/min. Use for shock, TBI, hypoxia, inhalation injury and before intubation. Also clears carbon monoxide faster.', apply(G) { G.P.o2dev = 'nrb'; G.P.fio2 = 0.8; say(G, 'info', 'Non-rebreather mask at 15 L/min.'); } });
A({ id: 'bvm_start', cat: 'resp', name: 'Bag-valve ventilation (ties up one person)', dur: 10, tgt: 'list', opts: () => [{ v: 8, label: 'Slow: 8 breaths/min' }, { v: 10, label: '10 breaths/min (1 per 6 s)' }, { v: 14, label: '14 breaths/min' }, { v: 20, label: 'Fast: 20 breaths/min' }], info: 'Squeeze once every 6 seconds. Too fast raises chest pressure, drops blood pressure in shock, and in head injury lowers CO₂ and cerebral blood flow. Needs a patent airway or airway device.', req: G => (G.P.airway.device || G.P.airway.blood < 0.5) ? null : 'Airway must be opened first.', apply(G, rate, ctx) { const P = G.P; if (P.vent.mode === 'bvm' && P.vent.role) { const r0 = G.roles.find(r => r.id === P.vent.role); if (r0) { r0.sustain = null; r0.busyUntil = 0; r0.task = null; } } P.vent.mode = 'bvm'; P.vent.rate = +rate; P.vent.role = ctx.role.id; ctx.role.sustain = 'Bagging'; ctx.role.busyUntil = Infinity; ctx.role.task = 'Bagging (' + rate + '/min)'; if (!P.mon.etco2 && P.airway.device) say(G, 'info', 'Tip: attach capnography to guide ventilation.'); say(G, 'info', `Ventilating by BVM at ${rate}/min.`); } });
A({ id: 'vent_start', cat: 'resp', name: 'Transport ventilator', dur: 60, roles: ['CRNA', 'RN', 'EP', 'MED'], sup: null, tgt: 'list', adv: true, opts: () => [{ v: '12|1.0', label: 'Rate 12, FiO₂ 100% (starting settings)' }, { v: '14|1.0', label: 'Rate 14, FiO₂ 100%' }, { v: '10|0.6', label: 'Rate 10, FiO₂ 60%' }, { v: '20|1.0', label: 'Rate 20, FiO₂ 100%' }, { v: '8|0.4', label: 'Rate 8, FiO₂ 40%' }], info: 'Frees hands. Requires a tube, surgical airway or SGA. Start at 12–14/min, tidal volume 6–8 mL/kg ideal weight, then titrate to EtCO₂ and SpO₂. Avoid hyperventilation.', cpg: 'Mechanical Ventilation Basics', req: G => !G.P.airway.device || G.P.airway.device === 'npa' ? 'Needs ETT, SGA or surgical airway.' : (G.supplies.vent > 0 ? null : 'No ventilator available.'), apply(G, v) { const P = G.P; const [r, f] = String(v).split('|').map(Number); if (P.vent.mode === 'bvm' && P.vent.role) { const r0 = G.roles.find(x => x.id === P.vent.role); if (r0) { r0.sustain = null; r0.busyUntil = 0; r0.task = null; } } P.vent.mode = 'vent'; P.vent.rate = r; P.vent.fio2 = f; P.vent.role = null; P.o2dev = 'vent'; P.fio2 = f; say(G, 'ok', `Ventilator on: rate ${r}, FiO₂ ${Math.round(f * 100)}%. Hands are free.`); } });
A({ id: 'vent_stop', cat: 'resp', name: 'Stop assisted ventilation', dur: 5, info: 'Only if the patient has recovered adequate spontaneous breathing and is not paralyzed.', req: G => G.P.vent.mode ? null : 'Not being ventilated.', apply(G) { const P = G.P; if (P.vent.role) { const r0 = G.roles.find(x => x.id === P.vent.role); if (r0) { r0.sustain = null; r0.busyUntil = 0; r0.task = null; } } P.vent.mode = null; P.vent.role = null; if (P.o2dev === 'vent') { P.o2dev = P.airway.device ? 'nrb' : 'nrb'; P.fio2 = 0.8; } say(G, 'info', P.paralyzed ? 'Ventilation stopped. The patient is still paralyzed!' : 'Ventilation stopped.'); } });
A({ id: 'chest_seal', cat: 'resp', name: 'Vented chest seal', dur: 15, sup: { seal: 1 }, tgt: 'wound', woundOk: w => w.thoracic && !w.sealed, info: 'Seal any open chest wound with a vented seal. If the patient worsens (more distress, falling SpO₂, shock) suspect tension pneumothorax: burp or lift the seal, and decompress if needed.', cpg: 'TCCC / Wartime Thoracic Injury', apply(G, id) { const w = woundById(G, id); if (!w) return; const stick = G.mode !== 'realistic' || rnd() > 0.1; if (!stick) { say(G, 'warn', 'Seal will not stick to the bloody skin. Wipe and reapply.'); G.supplies.seal += 0; return; } w.sealed = true; w.dressed = true; const c = G.P.chest[w.thoracic]; c.sealed = true; c.open = false; say(G, 'ok', `Chest seal applied: ${w.label}. Watch for tension pneumothorax.`); } });
A({ id: 'chest_burp', cat: 'resp', name: 'Burp / lift chest seal', dur: 15, tgt: 'side', info: 'If a sealed chest wound is causing tension, lift the edge of the seal to let trapped air out, then reseal.', apply(G, s) { const c = G.P.chest[s]; if (!c.sealed) { say(G, 'info', 'No seal on that side.'); return; } if (c.tension > 0.2) { c.tension = Math.max(0, c.tension - 0.6); say(G, 'ok', 'Air hissed out. Distress eased. Reassess.'); } else say(G, 'info', 'No air escaped.'); } });
A({ id: 'needle_d', cat: 'resp', name: 'Needle decompression (14g 3.25")', dur: 20, sup: { needle: 1 }, tgt: 'needle', opts: () => [{ v: 'L-5', label: 'LEFT — 5th intercostal space, anterior axillary line' }, { v: 'L-2', label: 'LEFT — 2nd intercostal space, mid-clavicular line' }, { v: 'R-5', label: 'RIGHT — 5th intercostal space, anterior axillary line' }, { v: 'R-2', label: 'RIGHT — 2nd intercostal space, mid-clavicular line' }], info: 'For suspected tension pneumothorax: respiratory distress/hypoxia + shock + absent breath sounds. 14g or 10g, 3.25-inch catheter, 5th intercostal space at the anterior axillary line or 2nd space mid-clavicular line, inserted just above the rib, perpendicular to the chest wall. Follow with a chest tube when available.', cpg: 'TCCC Guidelines', apply(G, v) { const P = G.P; const s = v[0], site = v.split('-')[1]; const c = P.chest[s]; const p = (site === '5' ? 0.92 : 0.8) - (G.mode === 'realistic' ? 0.06 : 0); const ok = G.mode === 'guided' || rnd() < p; if (c.tension > 0.15) { if (!ok) { say(G, 'warn', 'No rush of air. Catheter may be too short or kinked. Reassess and repeat or use finger thoracostomy.'); return; } c.tension = 0.03; c.ptx = Math.max(c.ptx, 0.45); c.needleT = G.t; say(G, 'ok', `Rush of air from the ${sideName(s)} chest. Breathing eases and blood pressure rises.`); G.flags.decompT = G.flags.decompT || G.t; } else { c.ptx = Math.min(1, c.ptx + 0.25); pen(G, 6, `Needle decompression on the ${sideName(s)} side without tension: caused a pneumothorax.`); say(G, 'warn', 'No air released. Wrong side or not tension.'); } } });
A({ id: 'finger_thor', cat: 'resp', name: 'Finger thoracostomy', dur: 90, roles: ['SURG', 'EP', 'MED'], tgt: 'side', adv: true, info: 'Incision at the 5th space, anterior axillary line, blunt dissection into the pleural space, finger sweep. More reliable than a needle for tension in hospital-level care, and the step before a chest tube.', apply(G, s) { const c = G.P.chest[s]; c.tension = 0; c.ft = true; c.ptx *= 0.4; c.needleT = -1; say(G, 'ok', `Finger thoracostomy ${sideName(s)}: ${c.hemo > 300 ? 'blood and air released' : 'air released'}.`); } });
A({ id: 'chest_tube', cat: 'resp', name: 'Chest tube (tube thoracostomy)', dur: 180, roles: ['SURG', 'EP', 'MED'], sup: { chesttube: 1 }, tgt: 'side', adv: true, info: 'Definitive treatment for pneumothorax and hemothorax. Initial output >1,500 mL or >200 mL/h for 2–4 hours points to thoracotomy.', cpg: 'Wartime Thoracic Injury', apply(G, s) { const c = G.P.chest[s]; c.tube = true; c.tension = 0; c.ptx = Math.min(c.ptx, 0.1); c.ft = false; say(G, 'ok', `Chest tube ${sideName(s)} placed. ${c.hemo > 100 ? 'Blood draining.' : 'Air bubbling, no blood.'}`); } });
A({ id: 'pericardiocentesis', cat: 'resp', name: 'Pericardiocentesis (ultrasound-guided)', dur: 150, roles: ['EP', 'SURG'], sup: { pericardio: 1 }, adv: true, info: 'A temporary bridge for tamponade. Clotted blood often blocks the needle, so thoracotomy / pericardiotomy is the definitive answer.', apply(G) { const P = G.P; if (P.tamp < 0.1) { pen(G, 5, 'Pericardiocentesis without tamponade.'); return; } P.tamp = Math.max(0.12, P.tamp - 0.45); say(G, 'ok', 'Blood aspirated from the pericardium. Pressure improves, for now.'); G.flags.pericard = true; } });
A({ id: 'escharotomy_chest', cat: 'resp', name: 'Chest escharotomy', dur: 120, roles: ['SURG', 'EP'], adv: true, info: 'Circumferential full-thickness burns of the chest can restrict breathing. Incise the burned skin along the sides to release it.', apply(G) { const P = G.P; if (P.restrict > 0) { P.restrict = 0; say(G, 'ok', 'Escharotomy done. Chest wall expands, ventilation improves.'); } else say(G, 'info', 'No restrictive chest burn.'); } });

/* ============================== CIRCULATION ============================== */
A({ id: 'iv_access', cat: 'circ', name: 'Peripheral IV (18g)', dur: 60, roles: ['RN', 'TECH', 'MED', 'EP', 'CRNA', 'SURG'], sup: { iv: 1 }, tgt: 'list', opts: () => SITES_IV, info: 'Large-bore peripheral line. In shock veins collapse: if two attempts fail, go straight to IO.', apply(G, site) { const P = G.P; if (P.lines.some(l => l.site === site && l.patent)) { say(G, 'info', 'Line already there.'); return; } if (ivAttempt(G, 'iv')) { P.lines.push({ kind: 'iv', site, t: G.t, patent: true }); say(G, 'ok', `18g IV placed: ${site}.`); } else say(G, 'warn', `Missed the vein at ${site}. Veins are collapsing. Try another site or use IO.`); } });
A({ id: 'io_access', cat: 'circ', name: 'Intraosseous (IO) access', dur: 45, sup: { io: 1 }, tgt: 'list', opts: () => SITES_IO, info: 'Fast, reliable access in shock. Humeral head and sternum flow best. Anything that goes in a vein goes in a bone: blood, TXA, calcium, drugs.', cpg: 'TCCC Guidelines', apply(G, site) { const P = G.P; if (ivAttempt(G, 'io')) { P.lines.push({ kind: 'io', site, t: G.t, patent: true }); say(G, 'ok', `IO placed: ${site}.`); } else say(G, 'warn', 'IO did not flush. Needle probably against cortex. Repeat in another site.'); } });
A({ id: 'cvc', cat: 'circ', name: 'Central line / large-bore introducer', dur: 240, roles: ['CRNA', 'EP', 'SURG'], sup: { cvc: 1 }, adv: true, info: 'Large-bore central access for rapid infusion and vasoactive drugs. Takes minutes: do not delay blood while placing it.', apply(G) { const P = G.P; if (ivAttempt(G, 'cvc')) { P.lines.push({ kind: 'cvc', site: 'R femoral/IJ', t: G.t, patent: true }); say(G, 'ok', 'Central access placed. Rapid infusion possible.'); } else say(G, 'warn', 'Unable to cannulate the vein. Try again or use IO.'); } });
A({ id: 'wb', cat: 'circ', name: 'Whole blood (LTOWB) — 1 unit', dur: 90, roles: ['RN', 'CRNA', 'EP', 'MED', 'SURG', 'TECH'], sup: { wb: 1 }, req: accessReq, info: 'First choice for hemorrhagic shock: carries oxygen, clotting factors and platelets together. Keep it warm. Give calcium with the first product.', cpg: 'Whole Blood Transfusion / Damage Control Resuscitation', apply(G) { infuseProduct(G, 'wb'); say(G, 'ok', 'Whole blood 1 unit given.'); } });
A({ id: 'prbc', cat: 'circ', name: 'Packed red cells — 1 unit', dur: 90, roles: ['RN', 'CRNA', 'EP', 'SURG', 'TECH'], sup: { prbc: 1 }, req: accessReq, info: 'Use with plasma (and platelets) in a balanced 1:1:1 ratio when whole blood is not available.', adv: true, apply(G) { infuseProduct(G, 'prbc'); say(G, 'ok', 'pRBC 1 unit given.'); G.flags.component = (G.flags.component || 0) + 1; } });
A({ id: 'plasma', cat: 'circ', name: 'Plasma — 1 unit', dur: 90, roles: ['RN', 'CRNA', 'EP', 'SURG', 'TECH'], sup: { plasma: 1 }, req: accessReq, adv: true, info: 'Replaces clotting factors. Pair with red cells 1:1.', apply(G) { infuseProduct(G, 'plasma'); say(G, 'ok', 'Plasma 1 unit given.'); G.flags.plasma = (G.flags.plasma || 0) + 1; } });
A({ id: 'dplasma', cat: 'circ', name: 'Dried plasma (reconstitute) — 1 unit', dur: 150, roles: ['RN', 'CRNA', 'MED', 'EP', 'TECH'], sup: { dplasma: 1 }, req: accessReq, info: 'Shelf-stable; mix with sterile water. Useful where thawed plasma is not possible.', cpg: 'Dried Plasma CPG', apply(G) { infuseProduct(G, 'dplasma'); say(G, 'ok', 'Dried plasma 1 unit given.'); G.flags.plasma = (G.flags.plasma || 0) + 1; } });
A({ id: 'plt', cat: 'circ', name: 'Platelets — 1 unit', dur: 90, roles: ['RN', 'CRNA', 'EP'], sup: { plt: 1 }, req: accessReq, adv: true, info: 'For massive transfusion when not using whole blood.', apply(G) { infuseProduct(G, 'plt'); say(G, 'ok', 'Platelets 1 unit given.'); } });
A({ id: 'lr', cat: 'circ', name: 'LR / Plasma-Lyte — 250 mL bolus', dur: 45, sup: { lr: 1 }, req: accessReq, info: 'Only if blood products are NOT available. Only about a third stays in the vessels, it dilutes clotting factors, cools the patient, and raises pressure enough to dislodge clots. Burn and crush patients are the exception.', apply(G) { const P = G.P; infuseCryst(G, 250, 0.3, 0.9, 0.2); say(G, 'info', 'LR 250 mL bolus.'); const bloodLeft = ['wb', 'prbc', 'plasma', 'dplasma'].some(k => (G.supplies[k] || 0) > 0); if (bloodLeft && lossFrac(P) > 0.15 && (P.crystTotal || 0) >= 500) pen(G, 3, 'Crystalloid given while blood products are available. Use blood for hemorrhage.'); G.flags.cryst = (G.flags.cryst || 0) + 1; } });
A({ id: 'hextend', cat: 'circ', name: 'Hextend — 500 mL', dur: 60, sup: { hextend: 1 }, req: accessReq, info: 'Colloid used when no blood products are available. Stays in the vessels longer than crystalloid.', apply(G) { infuseCryst(G, 500, 0.8, 0.7, 0.25); say(G, 'info', 'Hextend 500 mL infusing.'); } });
A({ id: 'hts', cat: 'circ', name: '3% hypertonic saline — 250 mL', dur: 120, sup: { hts: 1 }, req: accessReq, roles: ['RN', 'CRNA', 'EP', 'MED', 'SURG'], info: 'For brain herniation: fixed dilated pupil, falling GCS, Cushing response. Pulls water out of the brain. Needs a systolic pressure to be safe.', cpg: 'TBI CPGs', apply(G) { const P = G.P; P.htsUntil = G.t + 2700; P.bv = Math.min(P.bvNorm * 1.04, P.bv + 150); P.fluids.hts++; say(G, 'ok', 'Hypertonic saline bolus given.'); } });
A({ id: 'warmer_on', cat: 'circ', name: 'Attach fluid / blood warmer', dur: 60, roles: ['RN', 'CRNA', 'TECH', 'EP'], sup: { warmer: 1 }, adv: true, info: 'Cold blood in a bleeding patient is a hypothermia and clotting problem. Every infusion should go through a warmer.', apply(G) { G.P.warmer = true; say(G, 'ok', 'Warmer on the IV line. Infusions are now warmed.'); } });
A({ id: 'txa', cat: 'circ', name: 'Tranexamic acid (TXA) 2 g IV/IO', dur: 30, sup: { txa: 2 }, req: accessReq, info: 'Give as soon as possible in anyone needing blood or with significant hemorrhage, within 3 hours of injury. 2 g slow IV/IO push. Does not replace bleeding control.', cpg: 'TCCC / Damage Control Resuscitation', apply(G) { const P = G.P; if (P.txaT != null) { say(G, 'info', 'TXA already given.'); return; } if (elapsedInjury(G) > 10800) pen(G, 5, 'TXA given beyond 3 hours after injury. It may increase mortality.'); P.txaT = G.t; P.txaUntil = G.t + 28800; P.meds.push({ t: G.t, name: 'TXA', dose: '2 g IV/IO' }); say(G, 'ok', 'TXA 2 g given.'); } });
A({ id: 'cacl', cat: 'circ', name: 'Calcium chloride 1 g IV/IO', dur: 30, sup: { cacl: 1 }, req: accessReq, info: 'Blood products bind calcium. Low ionized calcium weakens the heart and clotting. Give 1 g with the first blood product and repeat as the transfusion continues. Calcium chloride burns tissue if infiltrated.', apply(G) { G.P.ica = Math.min(1.5, G.P.ica + 0.16); G.P.meds.push({ t: G.t, name: 'CaCl', dose: '1 g IV/IO' }); say(G, 'ok', 'Calcium chloride 1 g given.'); if (G.P.k > 6.5) G.P.kProtectUntil = G.t + 1800; } });
A({ id: 'cagluc', cat: 'circ', name: 'Calcium gluconate 3 g IV/IO', dur: 60, sup: { cagluc: 3 }, req: accessReq, adv: true, info: 'Equivalent to 1 g CaCl, gentler on veins. Also stabilizes the heart in hyperkalemia.', apply(G) { G.P.ica = Math.min(1.5, G.P.ica + 0.16); G.P.meds.push({ t: G.t, name: 'Ca gluconate', dose: '3 g IV/IO' }); say(G, 'ok', 'Calcium gluconate 3 g given.'); if (G.P.k > 6.5) G.P.kProtectUntil = G.t + 1800; } });
A({ id: 'norepi', cat: 'circ', name: 'Norepinephrine infusion', dur: 90, roles: ['CRNA', 'EP', 'SURG'], sup: { norepi: 1 }, req: accessReq, adv: true, info: 'Not a substitute for volume. It raises pressure by squeezing vessels and can worsen shock if the tank is empty. Reasonable once blood is running and pressure is still low, or in spinal/neurogenic shock.', apply(G) { const P = G.P; P.pressor = 1; if (lossFrac(P) > 0.25 && G.P.bv < P.bvNorm * 0.8) pen(G, 4, 'Vasopressor used while profoundly hypovolemic. Replace volume first.'); P.meds.push({ t: G.t, name: 'Norepinephrine', dose: 'infusion' }); say(G, 'info', 'Norepinephrine started.'); } });
A({ id: 'burn_rate', cat: 'circ', name: 'Set burn fluid rate (LR)', dur: 15, tgt: 'list', opts: G => [{ v: 0, label: 'Stop' }, { v: 200, label: '200 mL/h' }, { v: 300, label: '300 mL/h' }, { v: 400, label: '400 mL/h' }, { v: 500, label: '500 mL/h' }, { v: 600, label: '600 mL/h' }, { v: 800, label: '800 mL/h' }, { v: 1000, label: '1000 mL/h' }], req: accessReq, info: 'JTS burn "Rule of 10": TBSA% × 10 = starting mL/h for adults 40–80 kg (add 100 mL/h per 10 kg above 80 kg). Then adjust by urine output: target 30–50 mL/h (0.5 mL/kg/h). Too little = shock; too much = "fluid creep".', cpg: 'Burn Care', apply(G, r) { G.P.infRate = +r; G.flags.burnRateSet = true; say(G, 'info', `LR infusion set to ${r} mL/h.`); } });
A({ id: 'cpr', cat: 'circ', name: 'Start / stop CPR', dur: 10, info: 'In traumatic arrest, compressions help only if the cause is fixed: stop bleeding, decompress both chests, secure the airway, give blood, release tamponade. Without that, they do not work.', req: G => G.P.arrest ? null : 'Patient has a pulse.', apply(G) { G.P.cpr = !G.P.cpr; say(G, 'info', G.P.cpr ? 'Compressions started.' : 'Compressions paused.'); } });
A({ id: 'defib', cat: 'circ', name: 'Defibrillate', dur: 15, adv: true, req: G => G.P.arrest === 'VF' ? null : 'Not a shockable rhythm.', info: 'Only for ventricular fibrillation / pulseless VT.', apply(G) { const P = G.P; if (P.arrest === 'VF' && (P.k < 7.5 || G.t < P.kProtectUntil) && (P.temp > 30) && rnd() < 0.55) { P.arrest = null; P.lowMapT = 0; say(G, 'ok', 'Shock delivered. Sinus rhythm returns.'); } else say(G, 'warn', 'Shock delivered. VF persists.'); } });
A({ id: 'epi', cat: 'circ', name: 'Epinephrine 1 mg IV/IO', dur: 20, sup: { epi: 1 }, req: accessReq, adv: true, info: 'Low priority in traumatic arrest. Fix hemorrhage, tension, tamponade and hypoxia first.', apply(G) { const P = G.P; P.meds.push({ t: G.t, name: 'Epinephrine', dose: '1 mg IV/IO' }); say(G, 'info', 'Epinephrine 1 mg given.'); G.flags.epi = true; } });

/* ============================== MEDS ============================== */
function analgesic(G, name, dose, eff) { const P = G.P; P.meds.push({ t: G.t, name, dose }); }
A({ id: 'ketamine', cat: 'med', name: 'Ketamine (analgesic dose)', dur: 30, sup: { ket: 1 }, tgt: 'list', opts: () => [{ v: 'iv20', label: '20 mg slow IV/IO' }, { v: 'im50', label: '50 mg IM' }, { v: 'in50', label: '50 mg intranasal' }], info: 'Preferred analgesic in shock: pain relief without lowering blood pressure or breathing. Dissociation at higher doses. Repeat every 20–30 minutes if needed.', cpg: 'TCCC / Analgesia and Sedation in PFC', req: (G) => null, apply(G, v) { const P = G.P; if (v === 'iv20' && !nLines(P)) { say(G, 'warn', 'No IV/IO. Use IM or intranasal.'); return; } P.ketaEff = Math.min(8, P.ketaEff + 5); P.sedHypo += 0; analgesic(G, 'Ketamine', { iv20: '20 mg IV/IO', im50: '50 mg IM', in50: '50 mg IN' }[v]); say(G, 'ok', 'Ketamine given. Pain easing.'); } });
A({ id: 'fentanyl', cat: 'med', name: 'Fentanyl 50 mcg IV/IO', dur: 30, sup: { fent: 1 }, req: accessReq, info: 'Opioid for severe pain when blood pressure is adequate. Depresses breathing and lowers blood pressure, especially combined with other sedatives. Not first choice in shock.', apply(G) { const P = G.P; P.fentEff = Math.min(8, P.fentEff + 4); if (lossFrac(P) > 0.3 || P.sbp < 90) { P.sedHypo += 8; pen(G, 3, 'Opioid in a hypotensive patient. Blood pressure fell. Ketamine is safer in shock.'); } analgesic(G, 'Fentanyl', '50 mcg IV/IO'); say(G, 'ok', 'Fentanyl 50 mcg given.'); } });
A({ id: 'otfc', cat: 'med', name: 'OTFC fentanyl 800 mcg lozenge', dur: 20, sup: { otfc: 1 }, info: 'For a conscious patient with moderate–severe pain and no IV. Place between cheek and gum. Do not use with an unconscious or hypotensive patient.', apply(G) { const P = G.P; if (P.gcs < 12) { say(G, 'warn', 'Patient cannot hold the lozenge safely.'); return; } P.fentEff = Math.min(8, P.fentEff + 4); analgesic(G, 'OTFC', '800 mcg'); say(G, 'ok', 'OTFC lozenge placed. Remove it if the patient becomes drowsy.'); } });
A({ id: 'apap', cat: 'med', name: 'Acetaminophen 1,000 mg PO', dur: 20, sup: { apap: 2 }, info: 'Combat pill pack. For mild–moderate pain in a conscious patient who can swallow. Safe in bleeding.', apply(G) { const P = G.P; if (P.gcs < 14 || P.airway.device) { say(G, 'warn', 'Cannot take oral medication.'); return; } P.painBase = Math.max(0, P.painBase - 1); analgesic(G, 'Acetaminophen', '1,000 mg PO'); say(G, 'ok', 'Acetaminophen given.'); } });
A({ id: 'meloxicam', cat: 'med', name: 'Meloxicam 15 mg PO', dur: 20, sup: { melox: 1 }, info: 'NSAIDs impair platelets. Never give to a bleeding or shock patient. Combat pill pack use is for mild pain in non-bleeding casualties.', apply(G) { const P = G.P; if (lossFrac(P) > 0.05 || P.wounds.some(w => w.rateNow > 10)) pen(G, 5, 'NSAID (meloxicam) given to a bleeding casualty. It impairs clotting.'); P.painBase = Math.max(0, P.painBase - 1); analgesic(G, 'Meloxicam', '15 mg PO'); say(G, 'info', 'Meloxicam given.'); } });
A({ id: 'ondansetron', cat: 'med', name: 'Ondansetron 4 mg', dur: 20, sup: { ondans: 1 }, info: 'For nausea, especially after opioids or ketamine.', apply(G) { analgesic(G, 'Ondansetron', '4 mg'); say(G, 'info', 'Ondansetron given.'); } });
A({ id: 'naloxone', cat: 'med', name: 'Naloxone 0.4 mg', dur: 20, sup: { naloxone: 1 }, req: accessReq, info: 'Reverses opioid-induced breathing depression. Titrate: full reversal brings back severe pain.', apply(G) { const P = G.P; P.fentEff = 0; analgesic(G, 'Naloxone', '0.4 mg'); say(G, 'info', 'Naloxone given. Opioid effect reversed.'); } });
A({ id: 'ertapenem', cat: 'med', name: 'Ertapenem 1 g IV/IM', dur: 30, sup: { ertap: 1 }, info: 'Antibiotic for open wounds when the patient cannot take oral drugs. Give within 3 hours of wounding when possible.', cpg: 'Infection Prevention in Combat-Related Injuries / TCCC', apply(G) { G.P.abx = { t: G.t, name: 'Ertapenem 1 g' }; analgesic(G, 'Ertapenem', '1 g IV/IM'); say(G, 'ok', 'Ertapenem given.'); } });
A({ id: 'moxifloxacin', cat: 'med', name: 'Moxifloxacin 400 mg PO', dur: 20, sup: { moxi: 1 }, info: 'Oral antibiotic for a conscious patient who can swallow (combat pill pack).', apply(G) { const P = G.P; if (P.gcs < 14 || P.airway.device) { say(G, 'warn', 'Cannot take oral medication.'); return; } P.abx = { t: G.t, name: 'Moxifloxacin 400 mg' }; analgesic(G, 'Moxifloxacin', '400 mg PO'); say(G, 'ok', 'Moxifloxacin given.'); } });
A({ id: 'sedation_post', cat: 'med', name: 'Post-intubation analgesia + sedation', dur: 60, roles: ['CRNA', 'EP', 'RN', 'MED'], sup: { fent: 1, ket: 1 }, req: accessReq, adv: true, info: 'A paralyzed, intubated patient still feels pain and is awake unless sedated. Start analgesia first (fentanyl), then ketamine or another sedative.', apply(G) { const P = G.P; P.sedUntil = G.t + 5400; P.awareness = 0; P.fentEff = Math.min(8, P.fentEff + 3); P.ketaEff = Math.min(8, P.ketaEff + 3); P.meds.push({ t: G.t, name: 'Fentanyl + ketamine', dose: 'post-intubation' }); say(G, 'ok', 'Analgesia and sedation started.'); } });
A({ id: 'bicarb', cat: 'med', name: 'Sodium bicarbonate 50 mEq IV', dur: 45, sup: { bicarb: 1 }, req: accessReq, adv: true, info: 'Shifts potassium into cells and buffers acidosis in crush injury / hyperkalemia. Not routine for hemorrhagic acidosis.', apply(G) { const P = G.P; P.k = Math.max(3.8, P.k - 0.6); P.acid = Math.max(0, P.acid - 0.04); P.meds.push({ t: G.t, name: 'NaHCO3', dose: '50 mEq IV' }); say(G, 'ok', 'Bicarbonate given.'); } });
A({ id: 'albuterol', cat: 'med', name: 'Albuterol nebulizer (10 mg)', dur: 120, sup: { albuterol: 1 }, adv: true, info: 'Moves potassium into cells in hyperkalemia. Works within 30 minutes.', apply(G) { const P = G.P; P.albUntil = G.t + 1800; P.k = Math.max(3.8, P.k - 0.5); P.meds.push({ t: G.t, name: 'Albuterol', dose: '10 mg neb' }); say(G, 'ok', 'Albuterol neb given.'); } });
A({ id: 'insulin', cat: 'med', name: 'Insulin 10 U + dextrose', dur: 60, sup: { insulin: 1 }, req: accessReq, adv: true, info: 'Drives potassium into cells. Check glucose after.', apply(G) { const P = G.P; P.k = Math.max(3.8, P.k - 1.0); P.meds.push({ t: G.t, name: 'Insulin/D50', dose: '10 U + 25 g' }); say(G, 'ok', 'Insulin and dextrose given.'); } });
A({ id: 'antivenom', cat: 'med', name: 'Antivenom — 4 vials', dur: 600, sup: { antivenom: 4 }, req: accessReq, info: 'For progressive swelling or coagulopathy after a pit viper bite. Slow infusion; watch for allergic reaction.', cpg: 'Snakebite Envenomation', apply(G) { const P = G.P; if (!P.venom) { pen(G, 5, 'Antivenom given without envenomation.'); return; } P.venom.treated = true; P.meds.push({ t: G.t, name: 'Antivenom', dose: '4 vials' }); say(G, 'ok', 'Antivenom infusing. Swelling and clotting stabilize.'); } });
A({ id: 'hydroxo', cat: 'med', name: 'Hydroxocobalamin 5 g IV', dur: 900, roles: ['EP', 'RN', 'CRNA', 'MED'], sup: { hydroxo: 1 }, req: accessReq, adv: true, info: 'Cyanide antidote. Consider in smoke inhalation from an enclosed fire with altered mental status, hypotension or very high lactate.', cpg: 'Inhalation Injury & TIC Exposure', apply(G) { const P = G.P; P.cyanide = 0; P.meds.push({ t: G.t, name: 'Hydroxocobalamin', dose: '5 g IV' }); say(G, 'ok', 'Hydroxocobalamin infused.'); } });

/* ============================== ENVIRONMENT ============================== */
A({ id: 'hpmk', cat: 'env', name: 'Hypothermia kit (HPMK) wrap', dur: 90, sup: { hpmk: 1 }, info: 'Remove wet clothing, apply the heating blanket, then the heat-reflective shell with the head covered. Prevent heat loss from the start.', cpg: 'Hypothermia Prevention, Monitoring and Management', apply(G) { const P = G.P; P.hpmk = true; P.expo = 0.15; P.wet = false; say(G, 'ok', 'Hypothermia kit applied. Heat loss minimized.'); } });
A({ id: 'dry_wrap', cat: 'env', name: 'Remove wet clothes + blanket wrap', dur: 60, sup: { blanket: 1 }, info: 'Basic hypothermia prevention when no kit: get off the ground, remove wet clothing, insulate.', apply(G) { const P = G.P; P.wet = false; P.blanketOn = true; P.expo = Math.min(P.expo, 0.5); say(G, 'ok', 'Casualty dried and wrapped.'); } });
A({ id: 'forced_air', cat: 'env', name: 'Forced-air warmer', dur: 90, roles: ['RN', 'TECH', 'CRNA'], sup: { bair: 1 }, adv: true, info: 'Active external warming. Best done in the resus bay or OR.', apply(G) { const P = G.P; P.bairOn = true; P.expo = Math.min(P.expo, 0.2); P.heat = Math.max(P.heat, 0.07); say(G, 'ok', 'Forced-air warming on.'); } });
A({ id: 'warm_room', cat: 'env', name: 'Warm the room', dur: 120, roles: ['TECH', 'RN'], adv: true, info: 'Heater up, doors shut. Cold rooms drive the lethal triad during surgery.', apply(G) { G.P.heat = Math.max(G.P.heat, 0.02); G.P.expo = Math.min(G.P.expo, 0.6); say(G, 'ok', 'Room warmed.'); } });
A({ id: 'head_elev', cat: 'env', name: 'Elevate head of bed 30°', dur: 10, info: 'Lowers intracranial pressure in head injury once spinal injury and shock are addressed.', apply(G) { G.P.hob = true; say(G, 'ok', 'Head raised 30°.'); } });

/* ============================== WOUNDS ============================== */
A({ id: 'dress', cat: 'wound', name: 'Dress and bandage wounds', dur: 40, sup: { dressing: 1 }, tgt: 'wound', woundOk: w => !w.dressed && w.vessel !== 'internal' && w.vessel !== 'thoracic' && !w.burn, info: 'Cover every wound after bleeding is controlled. Reduces contamination and pain.', apply(G, id) { const w = woundById(G, id); if (!w) return; w.dressed = true; if (w.bleed < 30) w.pressDsg = true; G.P.painBase = Math.max(0, G.P.painBase - 0.5); say(G, 'ok', `Dressed: ${w.label}.`); } });
A({ id: 'eye_shield', cat: 'wound', name: 'Rigid eye shield', dur: 20, sup: { eyeshield: 1 }, info: 'Cover a penetrating eye injury with a rigid shield, no pressure. If the patient can swallow, give moxifloxacin.', cpg: 'Eye Trauma: Initial Care', apply(G) { G.P.eyeShield = true; say(G, 'ok', 'Rigid shield over the right eye.'); } });
A({ id: 'splint_fx', cat: 'wound', name: 'Splint fracture', dur: 60, sup: { splint: 1 }, info: 'Check distal pulse, movement and sensation before and after. Splinting reduces pain and bleeding.', apply(G) { G.P.painBase = Math.max(0, G.P.painBase - 1.5); say(G, 'ok', 'Fracture splinted. Distal pulse intact.'); } });
A({ id: 'collar', cat: 'wound', name: 'Cervical collar', dur: 30, sup: { collar: 1 }, info: 'Only for BLUNT trauma with neck pain or neurological deficit. Not for penetrating neck wounds: it hides bleeding and does not prevent harm.', cpg: 'TCCC / C-spine CPG', apply(G) { const P = G.P; P.collar = true; if (G.sc.penetrating) pen(G, 3, 'Cervical collar on a penetrating injury. No benefit, hides neck bleeding and delays care.'); say(G, 'info', 'Collar applied.'); } });
A({ id: 'burn_dsg', cat: 'wound', name: 'Cover burns (dry sterile dressings)', dur: 90, sup: { dressing: 2 }, info: 'Dry, clean dressings. Do not use wet dressings on large burns: they chill the patient. Do not apply creams in the field.', cpg: 'Burn Care', apply(G) { const P = G.P; P.wounds.forEach(w => { if (w.burn) w.dressed = true; }); P.painBase = Math.max(0, P.painBase - 1); P.expo = Math.min(P.expo, 0.5); say(G, 'ok', 'Burns covered with dry sterile dressings.'); } });
A({ id: 'debride', cat: 'wound', name: 'Irrigate and debride wounds', dur: 420, roles: ['SURG', 'EP'], sup: { dressing: 2 }, adv: true, info: 'Formal wound surgery: remove dead tissue and debris, irrigate with large volumes, leave wounds open. Done in the OR after life threats are controlled.', cpg: 'War Wounds: Debridement and Irrigation', apply(G) { G.P.wounds.forEach(w => { if (w.kind === 'blast' || w.kind === 'gsw') w.debrided = true; }); say(G, 'ok', 'Wounds irrigated and debrided. Left open.'); } });
A({ id: 'npwt', cat: 'wound', name: 'Negative-pressure wound dressing', dur: 180, roles: ['SURG', 'TECH', 'RN'], sup: { npwt: 1 }, adv: true, info: 'Vacuum dressing over open wounds after debridement.', apply(G) { say(G, 'ok', 'Wound vacuum applied.'); } });
A({ id: 'mark_swelling', cat: 'wound', name: 'Mark the swelling edge with time', dur: 20, info: 'Marking the leading edge of swelling every 15–30 min shows whether envenomation is progressing.', apply(G) { const P = G.P; if (P.venom) { say(G, 'finding', `Swelling edge marked at ${Math.round(P.venom.swell)} cm above the bite site. ${P.venom.last != null ? 'It was ' + Math.round(P.venom.last) + ' cm at the last mark.' : ''}`); P.venom.last = P.venom.swell; G.flags.marks = (G.flags.marks || 0) + 1; } else say(G, 'info', 'No swelling.'); } });
A({ id: 'remove_rings', cat: 'wound', name: 'Remove rings / watches; immobilize at heart level', dur: 40, info: 'Swelling will tighten jewelry. Keep the limb still at heart level. No tourniquet, ice, cutting or suction.', apply(G) { G.flags.venomFirstAid = true; G.P.painBase = Math.max(0, G.P.painBase - 1); say(G, 'ok', 'Jewelry removed. Limb splinted at heart level.'); } });
A({ id: 'bad_tq_venom', cat: 'wound', name: 'Tourniquet on a snakebite limb (not advised)', dur: 30, sup: { tq: 1 }, hideUnless: 'venom', info: 'Do NOT. A tourniquet concentrates venom and causes limb loss.', apply(G) { pen(G, 8, 'Tourniquet for snakebite. It concentrates venom and can cost the limb.'); } });

/* ============================== PROCEDURES (open mini-games) ============================== */
A({ id: 'or_setup', cat: 'proc', name: 'Set up the operating room', dur: 300, roles: ['TECH', 'RN', 'SURG'], adv: true, surgOnly: true, info: 'Warm the room, open instrument sets, check suction and cautery, notify anesthesia. Surgery needs the room ready.', apply(G) { G.orReady = true; G.orAt = G.t; say(G, 'ok', 'Operating room ready.'); } });
A({ id: 'proc_dcl', cat: 'proc', name: 'Damage-control laparotomy', dur: 60, roles: ['SURG'], adv: true, surgOnly: true, proc: 'dcl', info: 'Abbreviated laparotomy: control bleeding, control contamination, temporary closure, resuscitate, return in 24–48 h. Opens the surgery mini-game.', cpg: 'Austere Resuscitative Surgical Care / Emergency General Surgery', req: G => G.orReady ? null : 'Set up the operating room first.', apply(G) { G.hooks.proc && G.hooks.proc('dcl'); } });
A({ id: 'proc_ert', cat: 'proc', name: 'Resuscitative thoracotomy', dur: 45, roles: ['SURG', 'EP'], adv: true, surgOnly: true, proc: 'ert', info: 'For penetrating thoracic trauma with arrest or imminent arrest: release tamponade, control cardiac/lung bleeding, cross-clamp the aorta, internal cardiac massage.', cpg: 'Emergent Resuscitative Thoracotomy', apply(G) { G.hooks.proc && G.hooks.proc('ert'); } });
A({ id: 'proc_reboa', cat: 'proc', name: 'REBOA (aortic balloon occlusion)', dur: 60, roles: ['SURG', 'EP'], adv: true, surgOnly: true, proc: 'reboa', info: 'Balloon in the aorta via the femoral artery. Zone 1 for abdominal/torso bleeding, Zone 3 for pelvic/junctional bleeding. A bridge to surgery, time-limited.', cpg: 'REBOA for Hemorrhagic Shock', apply(G) { G.hooks.proc && G.hooks.proc('reboa'); } });
A({ id: 'proc_burr', cat: 'proc', name: 'Emergency burr hole (epidural hematoma)', dur: 90, roles: ['SURG', 'EP'], adv: true, surgOnly: true, proc: 'burr', info: 'A life-saving cranial procedure for a deteriorating patient with a presumed epidural hematoma when no neurosurgeon is within reach.', cpg: 'Emergency Life-Saving Cranial Procedures by Non-Neurosurgeons', apply(G) { G.hooks.proc && G.hooks.proc('burr'); } });
A({ id: 'proc_shunt', cat: 'proc', name: 'Temporary vascular shunt + fasciotomy', dur: 90, roles: ['SURG'], adv: true, surgOnly: true, proc: 'shunt', info: 'Restore blood flow to a limb fast with a shunt, then release the compartments with fasciotomy. Definitive repair later.', cpg: 'Vascular Injury / Compartment Syndrome and Fasciotomy', apply(G) { G.hooks.proc && G.hooks.proc('shunt'); } });
A({ id: 'fasciotomy', cat: 'proc', name: 'Four-compartment fasciotomy (leg)', dur: 600, roles: ['SURG', 'EP'], adv: true, surgOnly: true, info: 'Release all four compartments of the lower leg through two incisions for compartment syndrome or after revascularization/crush.', cpg: 'Acute Extremity Compartment Syndrome and Fasciotomy', apply(G) { G.flags.fasciotomy = true; G.P.crush && (G.P.crush.compartment = 0); say(G, 'ok', 'Two-incision four-compartment fasciotomy complete. Muscle bulges, wounds left open.'); } });

/* ============================== TEAM & DISPO ============================== */
A({ id: 'call_wbb', cat: 'dispo', name: 'Activate walking blood bank (fresh whole blood)', dur: 120, roles: ['RN', 'TECH', 'EP', 'MED'], adv: true, req: G => G.wbbAt ? 'Already activated.' : null, info: 'Pre-screened donors give fresh whole blood on site. Takes time to collect, so ask early when blood supply is limited.', cpg: 'Whole Blood Transfusion', apply(G) { G.wbbAt = G.t + 600; say(G, 'info', 'Walking blood bank activated. First units in about 10 minutes.'); } });
A({ id: 'document', cat: 'dispo', name: 'Update casualty card (DD 1380 / resuscitation record)', dur: 40, roles: ['RN', 'MED', 'TECH', 'EP'], info: 'Record tourniquet times, drugs and doses, fluids, vital signs. The next provider relies on it.', cpg: 'Documentation Requirements for Combat Casualty Care', apply(G) { G.flags.documented = G.t; say(G, 'ok', 'Casualty card updated with times, drugs and vitals.'); } });
A({ id: 'telemed', cat: 'dispo', name: 'Telemedicine consult (ADVISOR)', dur: 180, roles: ['EP', 'SURG', 'MED', 'RN'], info: 'Remote specialist advice for a case outside your comfort zone.', cpg: 'Telemedicine in the Deployed Setting', apply(G) { G.flags.telemed = (G.flags.telemed || 0) + 1; const c = G.sc.consult ? G.sc.consult(G) : (typeof coachSuggest === 'function' ? coachSuggest(G).text : 'Reassess in MARCH order.'); say(G, 'coach', 'Consult: ' + c); } });
A({ id: 'release_entrap', cat: 'dispo', name: 'Release the trapped casualty', dur: 120, roles: ['MED', 'EP', 'TECH', 'SURG'], hideUnless: 'crush', req: G => G.P.crush && !G.P.crush.released ? null : 'Not trapped.', info: 'In crush syndrome, the moment of release is the danger point: potassium and toxins flood the circulation. Prepare first: IV/IO fluids, ECG, calcium, bicarbonate.', cpg: 'Crush Syndrome (PFC)', apply(G) { const P = G.P; P.crush.released = true; P.crush.relT = G.t; G.flags.released = G.t; say(G, 'warn', 'Casualty released. Potassium and muscle breakdown products enter the circulation.'); } });
A({ id: 'handoff', cat: 'dispo', name: 'Package and hand off for evacuation', dur: 180, roles: ['RN', 'MED', 'EP', 'TECH', 'SURG'], info: 'Final step: monitors on, warm, lines secured, documented, 9-line / ATMIST handoff to the evacuation crew. Ends the scenario.', cpg: 'En Route Care Patient Packaging', apply(G) { G.hooks.end && G.hooks.end('evac'); } });
</script>
<script>
'use strict';
/* ============================================================
   PHARMACOLOGY — the learner types every dose.
   Effects scale with mg/kg. Underdoses do little, overdoses hurt,
   and drugs interact (opioid + benzodiazepine, QT drugs, insulin + glucose).
   ============================================================ */
SUP.mida = 'Midazolam 5 mg'; SUP.d50 = 'Dextrose D50 25 g'; SUP.ket = 'Ketamine 100 mg'; SUP.fent = 'Fentanyl 100 mcg'; SUP.txa = 'TXA 1 g'; SUP.cacl = 'Calcium chloride 1 g';
SUP.apap = 'Acetaminophen 500 mg'; SUP.albuterol = 'Albuterol 5 mg'; SUP.insulin = 'Insulin 10 U (+ dilution)'; SUP.bicarb = 'Sodium bicarbonate 50 mEq'; SUP.norepi = 'Norepinephrine infusion (per 100 mcg/min)'; SUP.epi = 'Epinephrine 1 mg'; SUP.naloxone = 'Naloxone 0.4 mg';
Object.assign(KIT_SOST, { mida: 3, d50: 3, fent: 6, txa: 6, apap: 10, ondans: 6, bicarb: 5, naloxone: 8, albuterol: 6, insulin: 4, cacl: 5, ket: 8 });
Object.assign(KIT_MEDIC, { mida: 0, d50: 0, fent: 2, txa: 3, apap: 4, naloxone: 4, ket: 4 });

const ROUTES = {
  iv: { id: 'iv', label: 'IV', bio: 1, access: true }, io: { id: 'io', label: 'IO', bio: 1, access: true },
  im: { id: 'im', label: 'IM', bio: 0.9, access: false }, in: { id: 'in', label: 'Intranasal', bio: 0.5, access: false },
  po: { id: 'po', label: 'By mouth', bio: 1, access: false, oral: true }, neb: { id: 'neb', label: 'Nebulizer', bio: 1, access: false }
};
const R = (...ids) => ids.map(i => ROUTES[i]);

/* helpers used by drug effects */
const pH = {
  resp(P, v) { P.resDep = clamp((P.resDep || 0) + v, 0, 1.6); },
  sedate(P, v) { P.sedDepth = clamp((P.sedDepth || 0) + v, 0, 9); },
  hypo(P, v) { P.sedHypo += v; },
  boost(P, v) { pH.fast(P, v * 0.8, v); },
  fast(P, hr, sbp) { P.hrFast = clamp((P.hrFast || 0) + hr, -50, 70); P.sbpFast = clamp((P.sbpFast || 0) + sbp, -50, 70); },
  slow(P, hr, sbp) { P.hrDrug = clamp((P.hrDrug || 0) + hr, -45, 60); P.sbpDrug = clamp((P.sbpDrug || 0) + sbp, -50, 50); },
  shock(P) { return lossFrac(P) > 0.3 || P.sbp < 90; },
  synergy(G) { const P = G.P; let n = 0; if (P.fentEff > 1.5) n++; if ((P.midazUntil || 0) > G.t) n++; if (P.ketaEff > 4) n++; if ((P.etomUntil || 0) > G.t) n++; return 1 + 0.55 * Math.max(0, n); },
  arrest(G, cause, type) { const P = G.P; if (P.arrest || P.dead) return; P.drugDeath = cause; startArrest(G, type || 'VF'); },
  seize(G, cause) { const P = G.P; if (G.t < (P.seizeUntil || 0)) return; P.seizeUntil = G.t + 180; pH.sedate(P, 5); pH.resp(P, 0.5); say(G, 'crit', 'SEIZURE: ' + cause + '. Protect the airway; midazolam stops it.'); pen(G, 4, 'Drug-induced seizure (' + cause + ').'); },
  rec(G, name, dose) { G.P.meds.push({ t: G.t, name, dose }); }
};

/* usual: [low, high] effective dose range in the drug's unit. hint = text shown in Guided mode. */
const DRUGS = {
  ketamine: {
    name: 'Ketamine', unit: 'mg', conc: 50, concTxt: '500 mg / 10 mL vial = 50 mg/mL', sup: 'ket', per: 100, routes: R('iv', 'io', 'im', 'in'), usual: [10, 40], kg: [0.1, 0.5],
    hint: 'Analgesic dose: 0.2 to 0.5 mg/kg IV/IO. TCCC lists 20 mg IV/IO, 50 mg IM or 50 mg intranasal. Dissociation starts near 1 mg/kg.',
    ref: 'Dissociative anesthetic. Analgesia 0.2–0.5 mg/kg IV, onset 1 min, lasts about 20 min. 1–2 mg/kg is an induction dose. Above 4 mg/kg expect apnea. Preserves breathing and pressure at low doses, but can lower pressure in a patient who is already out of adrenaline.',
    fx(G, d) {
      const P = G.P, x = d.E / P.kg, syn = pH.synergy(G);
      P.ketaEff = clamp(P.ketaEff + clamp(x / 0.25 * 5, 0, 10), 0, 12);
      pH.slow(P, Math.min(35, x * 55), pH.shock(P) ? 0 : Math.min(28, x * 30));
      if (x < 0.08) say(G, 'info', 'Ketamine dose too small to help. Pain barely changes.');
      else if (x < 0.8) say(G, 'ok', 'Ketamine given. Pain easing.');
      if (x >= 0.8) { pH.sedate(P, (x - 0.5) * 2.5); say(G, 'warn', 'The patient is dissociated: eyes open, not responding normally. Protect the airway.'); }
      if (x >= 1.5) { pH.resp(P, (x - 1.5) * 0.3 * syn); say(G, 'warn', 'Ketamine at induction dose: breathing may slow and the airway may spasm.'); }
      if (x > 4) { pH.resp(P, 1.3); pH.sedate(P, 5); P.airway.swelling = Math.min(1, P.airway.swelling + 0.1); pen(G, 6, 'Ketamine overdose (' + x.toFixed(1) + ' mg/kg). The patient stopped breathing.'); say(G, 'crit', 'APNEA from ketamine overdose. Bag-valve-mask now.'); }
      if (x > 1 && pH.shock(P)) { pH.hypo(P, (x - 1) * 7); say(G, 'warn', 'In shock, a large ketamine dose dropped the blood pressure.'); }
      if (syn > 1.4 && x >= 0.5) say(G, 'warn', 'Interaction: ketamine plus another sedative/opioid. Breathing depression is additive.');
    }
  },
  fentanyl: {
    name: 'Fentanyl', unit: 'mcg', conc: 50, concTxt: '100 mcg / 2 mL ampule = 50 mcg/mL', sup: 'fent', per: 100, routes: R('iv', 'io', 'im', 'in'), usual: [25, 100], kg: [0.3, 1.2],
    hint: 'Usual 0.5 to 1 mcg/kg IV/IO (TCCC: 50 mcg). Breathing slows above about 2 mcg/kg, and a very large dose can make the chest wall rigid.',
    ref: 'Opioid. 0.5–1 mcg/kg IV (25–100 mcg), onset 2 min, lasts 30–60 min. Respiratory depression at ≥2 mcg/kg, much worse with benzodiazepines or ketamine. Above 5 mcg/kg: apnea and wooden-chest rigidity. Lowers pressure, especially in shock. Reversed by naloxone.',
    fx(G, d) {
      const P = G.P, x = d.E / P.kg, syn = pH.synergy(G);
      P.fentEff = clamp(P.fentEff + clamp(x / 0.6 * 4, 0, 14), 0, 18);
      pH.hypo(P, (d.E / 50) * (pH.shock(P) ? 8 : 1.2)); pH.slow(P, -Math.min(25, x * 10), -Math.min(15, x * 6));
      if (pH.shock(P) && d.E >= 25) pen(G, 3, 'Opioid in a hypotensive patient. Pressure fell. Ketamine is safer in shock.');
      if (x < 0.1) say(G, 'info', 'Fentanyl dose too small to help.'); else say(G, 'ok', 'Fentanyl given.');
      if (x > 1.5) { pH.resp(P, (x - 1.5) * 0.28 * syn); say(G, 'warn', 'Breathing is slowing from the opioid.'); }
      if (x > 3) pH.sedate(P, (x - 3) * 1.3);
      if (x > 5) { pH.resp(P, 1.2); P.rigidUntil = G.t + 300; pen(G, 6, 'Fentanyl overdose (' + x.toFixed(1) + ' mcg/kg): apnea and chest-wall rigidity.'); say(G, 'crit', 'APNEA and a rigid chest. Bag-valve-mask, consider naloxone and a paralytic.'); }
      if (syn > 1.4 && x > 1) say(G, 'warn', 'Interaction: opioid with another sedative. Watch the respiratory rate and SpO₂ closely.');
    }
  },
  midazolam: {
    name: 'Midazolam', unit: 'mg', conc: 5, concTxt: '5 mg / 1 mL vial = 5 mg/mL', sup: 'mida', per: 5, routes: R('iv', 'io', 'im', 'in'), usual: [1, 5], kg: [0.01, 0.06],
    hint: 'Sedation or anxiety: 0.02 to 0.05 mg/kg (1 to 4 mg). For a seizure 5 to 10 mg IM. Above about 0.1 mg/kg it depresses breathing, much worse with opioids.',
    ref: 'Benzodiazepine. Sedation 1–2.5 mg IV titrated. Seizure: 10 mg IM or 5 mg IV. Respiratory depression is dose dependent and multiplied by opioids. Causes hypotension in shock. No analgesia.',
    fx(G, d) {
